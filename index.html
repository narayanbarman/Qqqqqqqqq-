<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>QuizCraft — Create, Share & Track Quizzes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            transition: background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .app-full {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 6px 4px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 14px 12px;
            margin-bottom: 10px;
            border: none;
        }
        .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f3f4;
            color: #1e293b;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: #1a73e8;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1557b0;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.35);
        }
        .btn-success {
            background: #0f9d58;
            color: #fff;
        }
        .btn-success:hover {
            background: #0d7a45;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 157, 88, 0.35);
        }
        .btn-danger {
            background: #d93025;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b71c1c;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #dadce0;
        }
        .btn-outline:hover {
            background: #f1f3f4;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 0.7rem;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        .upload-area {
            border: 2px dashed #dadce0;
            border-radius: 16px;
            background: #fafafa;
            padding: 16px;
            text-align: center;
            margin: 10px 0;
            transition: 0.2s;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #1a73e8;
            background: #f0f7ff;
        }
        .error-line {
            background: #fce8e6;
            border-left: 4px solid #d93025;
            padding: 6px 10px;
            border-radius: 10px;
            margin: 4px 0;
            font-size: 0.7rem;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        @media (max-width: 600px) {
            .card {
                padding: 12px 10px;
            }
            .app-full {
                padding: 4px 2px;
            }
        }
        .template-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 0 12px;
            margin: 6px 0;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .template-item {
            background: #f8f9fa;
            border-radius: 60px;
            padding: 6px 14px;
            font-size: 0.75rem;
            white-space: nowrap;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            flex-shrink: 0;
            font-family: 'Inter', sans-serif;
        }
        .template-item.active {
            border-color: #1a73e8;
            background: #e8f0fe;
        }
        .template-item i {
            margin-right: 4px;
        }
        .input-group {
            margin: 10px 0;
        }
        .input-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #5f6368;
            margin-bottom: 4px;
            display: block;
        }
        .input-field {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dadce0;
            border-radius: 14px;
            font-size: 0.85rem;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            background: #fff;
            color: #1e293b;
        }
        .input-field:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }
        textarea.input-field {
            resize: vertical;
            min-height: 80px;
        }
        .question-card {
            background: #fff;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #ecedef;
            transition: 0.2s;
            animation: fadeSlideUp 0.25s ease;
        }
        .question-card:hover {
            border-color: #dadce0;
        }
        .option-row {
            background: #f8f9fa;
            border-radius: 60px;
            padding: 10px 16px;
            margin: 8px 0;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
            position: relative;
            font-size: 0.9rem;
        }
        .option-row:hover {
            background: #f1f3f4;
            border-color: #dadce0;
        }
        .option-row .opt-letter {
            display: inline-flex;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #e8eaed;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7rem;
            color: #5f6368;
            flex-shrink: 0;
            transition: 0.3s;
        }
        .option-row.correct-feedback {
            background: #e6f4ea !important;
            border-color: #0f9d58 !important;
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(15, 157, 88, 0.25);
        }
        .option-row.correct-feedback .opt-letter {
            background: #0f9d58;
            color: #fff;
            transform: scale(1.08);
        }
        .option-row.correct-feedback::after {
            content: "✓";
            position: absolute;
            right: 14px;
            color: #0f9d58;
            font-weight: 700;
            font-size: 1rem;
        }
        .option-row.wrong-feedback {
            background: #fce8e6 !important;
            border-color: #d93025 !important;
            transform: scale(0.97);
            box-shadow: 0 4px 16px rgba(217, 48, 37, 0.2);
        }
        .option-row.wrong-feedback .opt-letter {
            background: #d93025;
            color: #fff;
            transform: scale(0.9);
        }
        .option-row.wrong-feedback::after {
            content: "✗";
            position: absolute;
            right: 14px;
            color: #d93025;
            font-weight: 700;
            font-size: 1rem;
        }
        .option-row.highlight-correct {
            background: #e6f4ea !important;
            border-color: #0f9d58 !important;
            box-shadow: 0 0 0 3px #0f9d58, 0 4px 16px rgba(15, 157, 88, 0.2);
            transform: scale(1.02);
        }
        .option-row.highlight-correct .opt-letter {
            background: #0f9d58;
            color: #fff;
            transform: scale(1.05);
        }
        .option-row.highlight-correct::after {
            content: "✓";
            position: absolute;
            right: 14px;
            color: #0f9d58;
            font-weight: 700;
            font-size: 1rem;
        }
        .option-row.disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        .option-row.disabled:not(.correct-feedback):not(.wrong-feedback):not(.highlight-correct) {
            opacity: 0.5;
        }
        .progress-bar {
            background: #ecedef;
            border-radius: 100px;
            height: 5px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            background: #1a73e8;
            width: 0%;
            height: 100%;
            transition: width 0.4s ease;
        }
        .booklet-wrap {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            padding: 8px 0;
            border-bottom: 1px solid #ecedef;
            margin-bottom: 12px;
            border-radius: 0 0 14px 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .booklet {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 3px 2px 6px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
            flex-wrap: nowrap;
        }
        .booklet::-webkit-scrollbar {
            height: 3px;
        }
        .booklet::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 4px;
        }
        .booklet-btn {
            min-width: 32px;
            height: 32px;
            border-radius: 32px;
            background: #f1f3f4;
            border: none;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.7rem;
            flex-shrink: 0;
            transition: 0.2s;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .booklet-btn:hover {
            background: #e8eaed;
            transform: scale(1.05);
        }
        .booklet-btn.answered {
            background: #1a73e8;
            color: #fff;
        }
        .booklet-btn.active-q {
            border: 2px solid #1a73e8;
            background: #e8f0fe;
            transform: scale(1.08);
        }
        .booklet-btn.answered.active-q {
            background: #1557b0;
            border-color: #0d47a1;
        }
        .booklet-btn.timeout {
            background: #d93025;
            color: #fff;
        }
        .timer-badge {
            background: #1e293b;
            color: #fff;
            padding: 4px 12px;
            border-radius: 40px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .timer-badge.warning {
            background: #d93025;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .timer-badge.total-timer {
            font-size: 0.95rem;
            padding: 6px 16px;
            background: #1e293b;
        }
        .timer-badge.total-timer.warning {
            background: #d93025;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.25s;
            z-index: 2000;
            padding: 16px;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-card {
            background: #fff;
            border-radius: 28px;
            max-width: 520px;
            width: 100%;
            padding: 24px 20px;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes popIn {
            from {
                transform: scale(0.95) translateY(10px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .recap-item {
            border-radius: 14px;
            padding: 10px 14px;
            margin: 8px 0;
            text-align: left;
            border-left: 4px solid #fef7e0;
            background: #fef7e0;
        }
        .recap-item.correct-recap {
            background: #e6f4ea;
            border-left-color: #0f9d58;
        }
        .recap-item.wrong-recap {
            background: #fce8e6;
            border-left-color: #d93025;
        }
        .recap-item.unanswered-recap {
            background: #f1f3f4;
            border-left-color: #9aa0a6;
        }
        .recap-item .q-text {
            font-weight: 500;
            font-size: 0.85rem;
        }
        .recap-item .q-detail {
            font-size: 0.75rem;
            color: #5f6368;
            margin-top: 3px;
        }
        .recap-item .q-detail strong {
            color: #1e293b;
        }
        .copy-link-btn {
            background: #e8eaed;
            border-radius: 60px;
            padding: 6px 16px;
            font-size: 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: 0.2s;
            border: none;
            font-family: 'Inter', sans-serif;
        }
        .copy-link-btn:hover {
            background: #dadce0;
        }
        .quiz-name-input {
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-bottom: 2px solid #dadce0;
            padding: 4px 0;
            width: 100%;
            outline: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
        }
        .quiz-name-input:focus {
            border-color: #1a73e8;
        }
        .logo-preview {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ecedef;
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 10px;
            margin: 12px 0;
        }
        .stat-card {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 12px 10px;
            text-align: center;
            border: 1px solid #ecedef;
        }
        .stat-card .stat-number {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a73e8;
        }
        .stat-card .stat-label {
            font-size: 0.6rem;
            color: #5f6368;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        .quiz-list-item {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 12px 14px;
            margin: 6px 0;
            border: 1px solid #ecedef;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .quiz-list-item:hover {
            background: #f1f3f4;
            border-color: #dadce0;
        }
        .quiz-list-item .ql-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e293b;
        }
        .quiz-list-item .ql-meta {
            font-size: 0.65rem;
            color: #5f6368;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .quiz-list-item .ql-stats {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 0.75rem;
        }
        .quiz-list-item .ql-stats span {
            background: #e8eaed;
            padding: 2px 8px;
            border-radius: 40px;
            font-weight: 500;
        }
        .attempt-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px 14px;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ecedef;
            transition: 0.2s;
        }
        .attempt-item:hover {
            background: #f1f3f4;
        }
        .attempt-item .score-badge {
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.75rem;
        }
        .attempt-item .score-badge.high {
            background: #e6f4ea;
            color: #0f9d58;
        }
        .attempt-item .score-badge.medium {
            background: #fef7e0;
            color: #e37400;
        }
        .attempt-item .score-badge.low {
            background: #fce8e6;
            color: #d93025;
        }
        .tab-bar {
            display: flex;
            gap: 3px;
            background: #f1f3f4;
            border-radius: 60px;
            padding: 3px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .tab-bar .tab-btn {
            border: none;
            padding: 6px 14px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
            color: #5f6368;
            flex: 1;
            min-width: 50px;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .tab-bar .tab-btn.active {
            background: #fff;
            color: #1a73e8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .tab-bar .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.5);
        }
        .tab-bar .tab-btn.primary-tab {
            color: #1a73e8;
        }
        .tab-bar .tab-btn.primary-tab.active {
            background: #1a73e8;
            color: #fff;
        }
        .tab-bar .tab-btn .btn-label {
            display: inline;
        }
        @media (max-width: 480px) {
            .tab-bar .tab-btn .btn-label {
                display: none;
            }
            .tab-bar .tab-btn i {
                font-size: 1rem;
            }
            .tab-bar .tab-btn {
                padding: 6px 10px;
                min-width: 40px;
            }
        }
        .tab-panel {
            display: none;
            animation: fadeSlideUp 0.3s ease;
        }
        .tab-panel.active {
            display: block;
        }
        .mock-question-list {
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 3px;
            scroll-behavior: smooth;
        }
        .mock-question-list::-webkit-scrollbar {
            width: 4px;
        }
        .mock-question-list::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 4px;
        }
        .mock-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 60px;
            border: 1px solid #ecedef;
            margin: 6px 0;
            cursor: pointer;
            transition: 0.15s;
            background: #fafafa;
        }
        .mock-option:hover {
            background: #f1f3f4;
            border-color: #dadce0;
        }
        .mock-option input[type="radio"] {
            accent-color: #1a73e8;
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .mock-option.selected {
            background: #e8f0fe;
            border-color: #1a73e8;
        }
        .mock-option .opt-label {
            font-weight: 500;
            font-size: 0.85rem;
        }
        .mock-option.disabled {
            opacity: 0.6;
            pointer-events: none;
        }
        .mock-header-sticky {
            position: sticky;
            top: 0;
            z-index: 50;
            background: #fff;
            padding: 10px 0 6px;
            border-bottom: 1px solid #ecedef;
            margin-bottom: 10px;
            border-radius: 0 0 14px 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .mock-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid #ecedef;
            margin-bottom: 8px;
        }
        .mock-header-top .btn {
            margin: 0;
        }
        .empty-state {
            text-align: center;
            padding: 30px 16px;
            color: #5f6368;
        }
        .empty-state i {
            font-size: 2.5rem;
            color: #dadce0;
            margin-bottom: 10px;
        }
        .empty-state .sub {
            font-size: 0.8rem;
            color: #9aa0a6;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.8rem;
            z-index: 3000;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }
        .mt-2 {
            margin-top: 10px;
        }
        .mt-3 {
            margin-top: 14px;
        }
        .mb-2 {
            margin-bottom: 10px;
        }
        .gap-2 {
            gap: 6px;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: #5f6368;
            font-size: 0.75rem;
        }
        .fw-600 {
            font-weight: 600;
        }

        /* ── COMPACT START HERO ── */
        .start-hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background: #f8f9fa;
            border-radius: 60px;
            padding: 8px 16px;
            margin-bottom: 14px;
            border: 1px solid #ecedef;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .start-hero .info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.85rem;
            color: #1e293b;
            font-weight: 500;
            flex-wrap: wrap;
        }
        .start-hero .info span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .start-hero .info i {
            color: #1a73e8;
        }
        .start-hero .btn-start {
            padding: 8px 28px;
            border-radius: 60px;
            background: #1a73e8;
            color: #fff;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 12px rgba(26, 115, 232, 0.25);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .start-hero .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 115, 232, 0.35);
        }
        .start-hero .btn-start:active {
            transform: scale(0.96);
        }
        .start-hero .btn-start i {
            margin-right: 6px;
        }
        @media (max-width: 480px) {
            .start-hero {
                flex-direction: column;
                align-items: stretch;
                border-radius: 20px;
                padding: 12px 16px;
            }
            .start-hero .info {
                justify-content: center;
                font-size: 0.8rem;
                gap: 10px;
            }
            .start-hero .btn-start {
                text-align: center;
                justify-content: center;
                padding: 10px 16px;
            }
        }

        .quiz-container.disabled {
            pointer-events: none;
            opacity: 0.7;
            transition: opacity 0.4s ease;
        }
        .quiz-container.disabled .option-row,
        .quiz-container.disabled .mock-option {
            cursor: default;
        }
        .quiz-container.enabled {
            pointer-events: auto;
            opacity: 1;
        }
        .quiz-container.enabled .option-row,
        .quiz-container.enabled .mock-option {
            cursor: pointer;
        }
        .quiz-container {
            transition: opacity 0.4s ease, transform 0.3s ease;
        }
        .mock-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .mock-header-actions .btn {
            white-space: nowrap;
        }
        @media (max-width: 480px) {
            .mock-header-actions {
                justify-content: flex-end;
                flex-wrap: wrap;
            }
            .mock-header-top {
                flex-direction: column;
                align-items: stretch;
            }
            .mock-header-top .btn {
                justify-content: center;
            }
            .mock-header-actions {
                justify-content: center;
            }
        }

        /* ── FEEDBACK ANIMATIONS ── */
        @keyframes correctPop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
            100% {
                transform: scale(1.02);
            }
        }
        @keyframes wrongShake {
            0% {
                transform: translateX(0) scale(1);
            }
            20% {
                transform: translateX(-5px) scale(0.98);
            }
            40% {
                transform: translateX(5px) scale(0.98);
            }
            60% {
                transform: translateX(-3px) scale(0.98);
            }
            80% {
                transform: translateX(3px) scale(0.98);
            }
            100% {
                transform: translateX(0) scale(0.97);
            }
        }
        @keyframes correctHighlight {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1.02);
            }
        }
        .option-row.correct-feedback {
            animation: correctPop 0.4s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
        }
        .option-row.wrong-feedback {
            animation: wrongShake 0.5s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
        }
        .option-row.highlight-correct {
            animation: correctHighlight 0.4s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
        }
    </style>
</head>
<body>

    <div class="app-full" id="app">
        <div id="toast" class="toast"></div>

        <!-- ====== STEP 1: CREATE / UPLOAD ====== -->
        <div id="stepUpload" class="card" style="display:none;">
            <div class="flex-between">
                <input type="text" id="quizNameInput" class="quiz-name-input" placeholder="Quiz Title" value="My Custom Quiz" />
                <div style="display:flex;align-items:center;gap:6px;">
                    <label for="logoUpload" style="cursor:pointer;font-size:0.7rem;color:#5f6368;"><i class="fas fa-camera"></i> Logo</label>
                    <input type="file" id="logoUpload" accept="image/*" style="display:none" />
                </div>
            </div>
            <div id="logoPreview" style="margin-bottom:6px;"></div>
            <div class="input-group">
                <label class="input-label"><i class="fas fa-upload"></i> Bulk Upload Questions</label>
                <div class="upload-area" id="dropzone">
                    <i class="fas fa-cloud-upload-alt fa-2x" style="color:#1a73e8;"></i>
                    <p style="font-size:0.75rem;margin-top:3px;">Drag &amp; drop or click (.csv, .xlsx, .txt)</p>
                    <input type="file" id="fileInput" accept=".csv,.xlsx,.txt" style="display:none" />
                    <button class="btn btn-outline btn-sm" id="chooseFileBtn" style="margin-top:4px;"><i class="fas fa-folder-open"></i> Browse</button>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label"><i class="fas fa-paste"></i> Paste CSV — <span class="text-muted">question, optA, optB, optC, optD, correct</span></label>
                <textarea id="bulkTextArea" class="input-field" rows="3" placeholder="Paste your CSV here or use the example below as a guide...">What is the capital of France? ,Paris,London,Berlin,Madrid,Paris
        Who wrote Hamlet? ,Shakespeare,Dickens,Hemingway,Tolstoy,Shakespeare
        What is 2+2? ,3,4,5,6,4</textarea>
            </div>
            <div id="validationErrors"></div>
            <div id="parsedPreview"></div>
            <button id="nextToTypeBtn" class="btn btn-primary btn-block" style="margin-top:10px;" disabled>Next: Choose Template &amp; Mode →</button>
            <button id="cancelCreateBtn" class="btn btn-outline btn-block mt-2"><i class="fas fa-arrow-left"></i> Back to Dashboard</button>
        </div>

        <!-- ====== STEP 2: TEMPLATE + MODE + TIMER ====== -->
        <div id="stepType" style="display:none;" class="card">
            <h3 style="font-size:1rem;margin-bottom:6px;">✨ Choose Theme</h3>
            <div class="template-scroll" id="templateList">
                <div class="template-item active" data-template="default">🌿 Default</div>
                <div class="template-item" data-template="ocean">🌊 Ocean</div>
                <div class="template-item" data-template="forest">🌲 Forest</div>
                <div class="template-item" data-template="sunset">🌅 Sunset</div>
                <div class="template-item" data-template="lavender">💜 Lavender</div>
                <div class="template-item" data-template="coffee">☕ Coffee</div>
                <div class="template-item" data-template="rose">🌹 Rose</div>
                <div class="template-item" data-template="sky">☁️ Sky</div>
                <div class="template-item" data-template="peach">🍑 Peach</div>
                <div class="template-item" data-template="mint">🍃 Mint</div>
                <div class="template-item" data-template="golden">✨ Golden</div>
                <div class="template-item" data-template="mono">⚪ Mono</div>
            </div>
            <div class="flex-between" style="margin:12px 0;">
                <button id="chooseQuizBtn" class="btn btn-primary"><i class="fas fa-play"></i> Quiz Mode</button>
                <button id="chooseMockBtn" class="btn btn-outline"><i class="fas fa-clock"></i> Mocktest Mode</button>
            </div>
            <div style="background:#f8f9fa;border-radius:16px;padding:12px;margin:10px 0;">
                <div class="flex-between">
                    <label style="font-size:0.8rem;"><i class="fas fa-hourglass-half"></i> Enable Timer</label>
                    <div><input type="checkbox" id="enableTimerCheck" checked /> <span style="font-size:0.7rem;">total time</span></div>
                </div>
                <div class="flex-between" style="margin-top:8px;">
                    <label style="font-size:0.8rem;">Seconds per question:</label>
                    <input type="number" id="timerSeconds" value="10" min="3" max="120" style="width:80px;border-radius:30px;padding:4px 8px;border:1px solid #dadce0;font-size:0.8rem;" />
                </div>
                <small style="color:#5f6368;font-size:0.65rem;">Total time = seconds × questions.</small>
            </div>
            <button id="finalCreateBtn" class="btn btn-success btn-block"><i class="fas fa-check-circle"></i> Create Assessment</button>
            <button id="backFromTypeBtn" class="btn btn-outline btn-block mt-2"><i class="fas fa-arrow-left"></i> Back</button>
        </div>

        <!-- ====== STEP 3: PLAY / SHARE / DASHBOARD ====== -->
        <div id="createdArea" style="display:none;" class="card">
            <div class="tab-bar" id="tabBar">
                <button class="tab-btn active" data-tab="play"><i class="fas fa-play"></i> <span class="btn-label">Play</span></button>
                <button class="tab-btn" data-tab="share"><i class="fas fa-link"></i> <span class="btn-label">Share</span></button>
                <button class="tab-btn" data-tab="dashboard"><i class="fas fa-chart-bar"></i> <span class="btn-label">Dashboard</span></button>
                <button class="tab-btn primary-tab" data-tab="create"><i class="fas fa-plus-circle"></i> <span class="btn-label">Create New</span></button>
            </div>
            <div class="tab-panel active" id="panelPlay">
                <div id="renderZone" style="margin-top:3px;width:100%;"></div>
            </div>
            <div class="tab-panel" id="panelShare">
                <div style="text-align:center;padding:16px 0;">
                    <i class="fas fa-share-alt" style="font-size:2rem;color:#1a73e8;margin-bottom:8px;display:block;"></i>
                    <h4 style="margin-bottom:6px;font-size:1rem;">Share Your Quiz</h4>
                    <p style="font-size:0.8rem;color:#5f6368;margin-bottom:12px;">Anyone with this link can take your quiz</p>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
                        <input type="text" id="shareLinkInput" readonly style="flex:1;min-width:160px;padding:8px 14px;border:1px solid #dadce0;border-radius:60px;font-size:0.8rem;background:#f8f9fa;font-family:'Inter',sans-serif;color:#1e293b;" />
                        <button class="btn btn-primary" id="copyLinkBtn"><i class="fas fa-copy"></i> Copy</button>
                    </div>
                    <div style="margin-top:12px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
                        <button class="btn btn-outline btn-sm" id="shareWhatsApp"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                        <button class="btn btn-outline btn-sm" id="shareTwitter"><i class="fab fa-twitter"></i> Twitter</button>
                        <button class="btn btn-outline btn-sm" id="shareEmail"><i class="fas fa-envelope"></i> Email</button>
                    </div>
                </div>
            </div>
            <div class="tab-panel" id="panelDashboard">
                <div id="dashboardContent">
                    <div class="text-center" style="padding:20px 0;color:#5f6368;">
                        <i class="fas fa-spinner fa-pulse fa-2x"></i>
                        <p style="margin-top:10px;font-size:0.85rem;">Loading stats…</p>
                    </div>
                </div>
            </div>
            <div class="tab-panel" id="panelCreate"></div>
        </div>
    </div>

    <script>
        // ================================================================
        // GLOBALS
        // ================================================================
        let questionsBank = [];
        let currentMode = "quiz";
        let selectedTemplate = "default";
        let timerEnabled = true;
        let timerSeconds = 10;
        let quizLogo = null;
        let quizTitle = "My Custom Quiz";
        let currentShortId = "";
        let currentQuizData = null;
        let timerInterval = null;
        let timeRemaining = 0;
        let isQuizActive = false;
        let isQuizStarted = false;
        let playerAnswers = [];
        let quizResults = null;
        let currentView = 'create'; // default to create page
        let currentViewData = null;

        const templates = {
            default: { bg: "#f0f2f5", cardBg: "#ffffff", accent: "#1a73e8", text: "#202124", border: "#ecedef",
                optionBg: "#f8f9fa" },
            ocean: { bg: "#e8f4f8", cardBg: "#ffffff", accent: "#0077b6", text: "#023e8a", border: "#caf0f8",
                optionBg: "#f0f9ff" },
            forest: { bg: "#eaf4e4", cardBg: "#ffffff", accent: "#2e7d32", text: "#1b5e20", border: "#c8e6c9",
                optionBg: "#f1f8e9" },
            sunset: { bg: "#fff3e0", cardBg: "#ffffff", accent: "#e65100", text: "#bf360c", border: "#ffe0b2",
                optionBg: "#fff8e1" },
            lavender: { bg: "#f3e5f5", cardBg: "#ffffff", accent: "#7b1fa2", text: "#4a148c", border: "#e1bee7",
                optionBg: "#fce4ec" },
            coffee: { bg: "#f5f0e6", cardBg: "#ffffff", accent: "#8d6e63", text: "#4e342e", border: "#d7ccc8",
                optionBg: "#faf0e6" },
            rose: { bg: "#fef2f2", cardBg: "#ffffff", accent: "#e11d48", text: "#881337", border: "#ffe4e6",
                optionBg: "#fff1f2" },
            sky: { bg: "#e0f2fe", cardBg: "#ffffff", accent: "#0284c7", text: "#0c4a6e", border: "#bae6fd",
                optionBg: "#f0f9ff" },
            peach: { bg: "#ffedd5", cardBg: "#ffffff", accent: "#ea580c", text: "#7c2d12", border: "#fed7aa",
                optionBg: "#fff7ed" },
            mint: { bg: "#dcfce7", cardBg: "#ffffff", accent: "#16a34a", text: "#14532d", border: "#bbf7d0",
                optionBg: "#f0fdf4" },
            golden: { bg: "#fef9c3", cardBg: "#ffffff", accent: "#ca8a04", text: "#713f12", border: "#fde047",
                optionBg: "#fefce8" },
            mono: { bg: "#f1f5f9", cardBg: "#ffffff", accent: "#475569", text: "#1e293b", border: "#e2e8f0",
                optionBg: "#f8fafc" }
        };

        function applyTemplate(name) {
            const t = templates[name] || templates.default;
            document.body.style.background = t.bg;
            document.querySelectorAll(".card").forEach(c => {
                c.style.backgroundColor = t.cardBg;
                c.style.borderColor = t.border;
            });
        }

        function showToast(msg, dur = 2600) {
            const el = document.getElementById("toast");
            el.textContent = msg;
            el.classList.add("show");
            clearTimeout(el._t);
            el._t = setTimeout(() => el.classList.remove("show"), dur);
        }

        // ================================================================
        // STORAGE
        // ================================================================
        function getAllQuizzes() {
            try { return JSON.parse(localStorage.getItem("quizCraftData") || "{}"); } catch { return {}; }
        }

        function saveQuizData(id, data) {
            const all = getAllQuizzes();
            all[id] = data;
            localStorage.setItem("quizCraftData", JSON.stringify(all));
        }

        function getQuizData(id) {
            const all = getAllQuizzes();
            return all[id] || null;
        }

        function deleteQuizData(id) {
            const all = getAllQuizzes();
            delete all[id];
            localStorage.setItem("quizCraftData", JSON.stringify(all));
            const plays = JSON.parse(localStorage.getItem("quizCraftPlays") || "{}");
            delete plays[id];
            localStorage.setItem("quizCraftPlays", JSON.stringify(plays));
        }

        function getQuizPlays(id) {
            try {
                const p = JSON.parse(localStorage.getItem("quizCraftPlays") || "{}");
                return p[id] || [];
            } catch { return []; }
        }

        function addQuizPlay(id, result) {
            const plays = JSON.parse(localStorage.getItem("quizCraftPlays") || "{}");
            if (!plays[id]) plays[id] = [];
            plays[id].push({ ...result, date: Date.now(), pid: Math.random().toString(36).substring(2, 8) });
            localStorage.setItem("quizCraftPlays", JSON.stringify(plays));
        }

        function generateId() {
            return Math.random().toString(36).substring(2, 10);
        }

        // ================================================================
        // PARSE CSV
        // ================================================================
        function parseBulkToQuestions(raw) {
            const lines = raw.split(/\r?\n/);
            const qs = [],
                errors = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const parts = line.split(',').map(s => s.trim());
                if (parts.length < 6) { errors.push(`Line ${i+1}: need Q, 4 opts, correct`); continue; }
                const qText = parts[0];
                const opts = parts.slice(1, 5);
                const correct = parts[5];
                const image = (parts.length > 6 && parts[6].startsWith("http")) ? parts[6] : null;
                if (!qText || opts.some(o => !o) || !correct) { errors.push(`Line ${i+1}: invalid`); continue; }
                qs.push({ text: qText, options: opts, correct, image });
            }
            return { questions: qs, errors };
        }

        function renderPreview(questions) {
            const div = document.getElementById("parsedPreview");
            if (!questions.length) {
                div.innerHTML =
                    `<div style="background:#f8f9fa;border-radius:14px;padding:10px;text-align:center;color:#5f6368;font-size:0.8rem;">
                            <i class="fas fa-info-circle"></i> No questions loaded yet. Add your questions above or use the example as a guide.
                        </div>`;
                return false;
            }
            let html =
                `<div style="max-height:140px;overflow:auto;background:#f8f9fa;border-radius:14px;padding:8px;"><strong style="font-size:0.85rem;">✅ ${questions.length} questions loaded</strong><br/>`;
            questions.forEach((q, idx) => {
                html +=
                    `<div style="background:#fff;border-radius:10px;padding:4px 10px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;border:1px solid #ecedef;font-size:0.8rem;">
                            <span><b>${idx+1}.</b> ${q.text.substring(0,50)}${q.text.length>50?'…':''}</span>
                            <button class="btn btn-outline btn-sm addImgBtn" data-idx="${idx}" style="padding:1px 8px;font-size:0.65rem;"><i class="fas fa-image"></i></button>
                        </div>`;
            });
            html += `</div>`;
            div.innerHTML = html;
            document.querySelectorAll('.addImgBtn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    const url = prompt("Image URL (jpg/png):");
                    if (url) questions[idx].image = url;
                    renderPreview(questions);
                });
            });
            return true;
        }

        function processBulk() {
            const raw = document.getElementById("bulkTextArea").value;
            const { questions, errors } = parseBulkToQuestions(raw);
            const errDiv = document.getElementById("validationErrors");
            errDiv.innerHTML = errors.map(e => `<div class="error-line">⚠️ ${e}</div>`).join('');
            if (questions.length) {
                questionsBank = questions;
                renderPreview(questionsBank);
                document.getElementById("nextToTypeBtn").disabled = false;
            } else {
                questionsBank = [];
                renderPreview([]);
                document.getElementById("nextToTypeBtn").disabled = true;
                if (!errors.length) {
                    errDiv.innerHTML =
                        `<div style="background:#f8f9fa;border-radius:10px;padding:6px 10px;font-size:0.75rem;color:#5f6368;">
                            <i class="fas fa-lightbulb"></i> Add questions above or use the example as a starting point.
                        </div>`;
                }
            }
        }

        // ================================================================
        // STATE PERSISTENCE
        // ================================================================
        function saveState() {
            const state = {
                currentView,
                currentViewData,
                currentShortId,
                selectedTemplate,
                timerEnabled,
                timerSeconds,
                quizTitle,
                quizLogo,
                currentMode,
                questionsBank: questionsBank.length > 0 ? questionsBank : []
            };
            try {
                localStorage.setItem('quizCraftState', JSON.stringify(state));
            } catch (e) {}
        }

        function restoreState() {
            try {
                const raw = localStorage.getItem('quizCraftState');
                if (!raw) return false;
                const state = JSON.parse(raw);
                if (state.currentView) {
                    currentView = state.currentView;
                    currentViewData = state.currentViewData || null;
                    currentShortId = state.currentShortId || '';
                    selectedTemplate = state.selectedTemplate || 'default';
                    timerEnabled = state.timerEnabled !== undefined ? state.timerEnabled : true;
                    timerSeconds = state.timerSeconds || 10;
                    quizTitle = state.quizTitle || 'My Custom Quiz';
                    quizLogo = state.quizLogo || null;
                    currentMode = state.currentMode || 'quiz';
                    if (state.questionsBank && state.questionsBank.length > 0) {
                        questionsBank = state.questionsBank;
                    }
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // ================================================================
        // NAVIGATION
        // ================================================================
        function navigateTo(view, data) {
            currentView = view;
            currentViewData = data || null;
            saveState();

            switch (view) {
                case 'dashboard':
                    showDashboardView();
                    break;
                case 'create':
                    showCreateView(data);
                    break;
                case 'play':
                    if (data) showPlayView(data);
                    break;
                case 'share':
                    showShareView();
                    break;
                default:
                    showCreateView();
            }
        }

        // ================================================================
        // VIEWS
        // ================================================================

        function showDashboardView() {
            document.getElementById("stepUpload").style.display = "none";
            document.getElementById("stepType").style.display = "none";
            document.getElementById("createdArea").style.display = "block";
            document.querySelectorAll("#tabBar .tab-btn").forEach(b => b.classList.remove("active"));
            document.querySelector("#tabBar .tab-btn[data-tab='dashboard']")?.classList.add("active");
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
            document.getElementById("panelDashboard").classList.add("active");
            renderFullDashboard();
            currentView = 'dashboard';
            saveState();
        }

        function renderFullDashboard() {
            const container = document.getElementById("dashboardContent");
            const all = getAllQuizzes();
            const ids = Object.keys(all);

            if (!ids.length) {
                container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-clipboard-list"></i>
                            <h4 style="margin-bottom:3px;font-size:1rem;">No quizzes yet</h4>
                            <p class="sub">Click <strong>+</strong> to create your first quiz</p>
                            <button class="btn btn-primary mt-3" onclick="navigateTo('create')"><i class="fas fa-plus"></i> Create New Quiz</button>
                        </div>
                    `;
                return;
            }

            let html = `<div style="margin-bottom:10px;"><h4 style="font-size:0.95rem;color:#1e293b;">📚 Your Quizzes</h4></div>`;

            ids.forEach(id => {
                const q = all[id];
                const plays = getQuizPlays(id);
                const total = plays.length;
                let avg = 0;
                let pass = 0;
                if (total) {
                    const sum = plays.reduce((s, p) => s + (p.score || 0), 0);
                    avg = Math.round((sum / total) * 10) / 10;
                    pass = plays.filter(p => (p.score / p.total) >= 0.6).length;
                }
                const date = new Date(q.createdAt).toLocaleDateString();
                html += `
                        <div class="quiz-list-item" onclick="navigateTo('play', { id: '${id}' })">
                            <div>
                                <div class="ql-title">${q.title || 'Untitled'}</div>
                                <div class="ql-meta">
                                    <span>${q.questions.length} Qs</span>
                                    <span>${q.mode === 'quiz' ? '📝 Quiz' : '📖 Mocktest'}</span>
                                    <span>${date}</span>
                                </div>
                            </div>
                            <div class="ql-stats">
                                <span><i class="fas fa-users"></i> ${total}</span>
                                <span><i class="fas fa-star"></i> ${avg || '-'}</span>
                                <span style="background:${total && pass/total >= 0.6 ? '#e6f4ea' : '#fce8e6'};">
                                    ${total ? Math.round((pass/total)*100)+'%' : '—'}
                                </span>
                                <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();deleteQuiz('${id}')" style="color:#d93025;border-color:#fce8e6;padding:2px 8px;font-size:0.65rem;">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
            });

            const totalPlays = ids.reduce((s, id) => s + getQuizPlays(id).length, 0);
            const totalQs = ids.reduce((s, id) => s + (all[id].questions?.length || 0), 0);

            html += `
                    <div class="stat-grid" style="margin-top:12px;">
                        <div class="stat-card"><div class="stat-number">${ids.length}</div><div class="stat-label">Total Quizzes</div></div>
                        <div class="stat-card"><div class="stat-number">${totalQs}</div><div class="stat-label">Total Questions</div></div>
                        <div class="stat-card"><div class="stat-number">${totalPlays}</div><div class="stat-label">Total Plays</div></div>
                    </div>
                `;

            container.innerHTML = html;
        }

        window.deleteQuiz = function(id) {
            if (!confirm("Delete this quiz and all its data?")) return;
            deleteQuizData(id);
            showToast("Quiz deleted");
            renderFullDashboard();
        };

            document.getElementById("logoPreview").innerHTML = quizLogo ? `<img src="${quizLogo}" class="logo-preview">` :
                "";
            questionsBank = [];
            document.getElementById("parsedPreview").innerHTML = "";
            document.getElementById("validationErrors").innerHTML = "";
            document.getElementById("nextToTypeBtn").disabled = true;
            document.getElementById("enableTimerCheck").checked = timerEnabled;
            document.getElementById("timerSeconds").value = timerSeconds;

        function showShareView() {
            document.getElementById("createdArea").style.display = "block";
            document.querySelectorAll("#tabBar .tab-btn").forEach(b => b.classList.remove("active"));
            document.querySelector("#tabBar .tab-btn[data-tab='share']")?.classList.add("active");
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
            document.getElementById("panelShare").classList.add("active");

        function showPlayView(data) {
            document.getElementById("createdArea").style.display = "block";
            document.querySelectorAll("#tabBar .tab-btn").forEach(b => b.classList.remove("active"));
            document.querySelector("#tabBar .tab-btn[data-tab='play']")?.classList.add("active");
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
            document.getElementById("panelPlay").classList.add("active");
            if (data && data.id) {
                const qd = getQuizData(data.id);
                if (qd) {
                    currentShortId = data.id;
                    currentQuizData = qd;
                    selectedTemplate = qd.template || "default";
                    applyTemplate(selectedTemplate);
                    isQuizStarted = false;
                    isQuizActive = false;
                    quizResults = null;
                    playerAnswers = [];
                    if (timerInterval) { clearInterval(timerInterval);
                        timerInterval = null; }
                    renderAssessmentFromData(qd);
                    currentView = 'play';
                    currentViewData = { id: data.id };
                    saveState();
                    return;
                } else {
                    showToast("Quiz not found");
                    navigateTo('create');
                    return;
                }
            }
            if (currentQuizData) {
                renderAssessmentFromData(currentQuizData);
                currentView = 'play';
                saveState();
            } else {
                navigateTo('create');
            }
        }

        // ================================================================
        // RENDER ASSESSMENT
        // ================================================================
        function renderAssessmentFromData(data, started = false) {
            const container = document.getElementById("renderZone");
            const t = templates[data.template] || templates.default;

            let contentHtml = '';
            if (data.mode === "quiz") {
                contentHtml = buildQuizHtml(data, t);
            } else {
                contentHtml = buildMockHtml(data, t);
            }

            const wrapper = document.createElement('div');
            wrapper.id = 'quizContainerWrapper';
            wrapper.className = 'quiz-container' + (started ? ' enabled' : ' disabled');
            wrapper.innerHTML = contentHtml;

            container.innerHTML = '';

            // Start hero – compact bar
            const totalTime = data.timerEnabled ? data.timerSeconds * data.questions.length : 0;
            const hero = document.createElement('div');
            hero.id = 'startHero';
            hero.className = 'start-hero';
            hero.innerHTML = `
                <div class="info">
                    <span><i class="fas fa-list-ul"></i> ${data.questions.length} questions</span>
                    ${data.timerEnabled ? `<span><i class="fas fa-clock"></i> ${totalTime}s total</span>` : '<span>∞ No timer</span>'}
                </div>
                <button class="btn-start" id="startQuizBtn"><i class="fas fa-play"></i> Start ${data.mode === 'quiz' ? 'Quiz' : 'Mocktest'}</button>
            `;
            container.appendChild(hero);

            container.appendChild(wrapper);

            if (data.mode === "quiz") {
                attachQuizEvents(data, t);
            } else {
                attachMockEvents(data, t);
            }

            // Start button listener
            const startBtn = document.getElementById('startQuizBtn');
            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    const heroEl = document.getElementById('startHero');
                    if (heroEl) {
                        heroEl.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                        heroEl.style.opacity = '0';
                        heroEl.style.transform = 'translateY(-10px)';
                        setTimeout(() => heroEl.remove(), 300);
                    }
                    const wrapperEl = document.getElementById('quizContainerWrapper');
                    if (wrapperEl) {
                        wrapperEl.classList.remove('disabled');
                        wrapperEl.classList.add('enabled');
                        wrapperEl.querySelectorAll('.option-row, .mock-option').forEach(el => {
                            el.style.pointerEvents = 'auto';
                            el.style.opacity = '1';
                        });
                    }
                    if (data.timerEnabled) {
                        const total = data.timerSeconds * data.questions.length;
                        timeRemaining = total;
                        startTotalTimer(data);
                    }
                    isQuizActive = true;
                    isQuizStarted = true;
                    showToast('Quiz started! Good luck! 🍀');
                });
            }
        }

                const total = data.timerSeconds * questions.length;

            }
            let html = `
                    <div style="background:${t.bg};border-radius:20px;padding:14px;border:1px solid ${t.border};">
                        <div class="flex-between" style="margin-bottom:6px;">

                                ${data.logo ? `<img src="${data.logo}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">` : ''}
                                <span style="font-weight:600;color:${t.text};font-size:0.85rem;">${data.title}</span>
                            </div>
                            ${timerHtml}
                        </div>
                        <div class="booklet-wrap"><div class="booklet" id="quizBookNav"></div></div>
                        <div id="quizSlides"></div>
                        <div class="progress-bar"><div id="quizProgressFill" class="progress-fill"></div></div>
                        <div class="flex-between" style="margin-top:12px;">
                            <button id="quizPrevBtn" class="btn btn-outline btn-sm"><i class="fas fa-chevron-left"></i> Prev</button>
                            <span id="quizCounter" style="font-size:0.75rem;color:#5f6368;">1 / ${questions.length}</span>
                            <button id="quizNextBtn" class="btn btn-primary btn-sm">Next <i class="fas fa-chevron-right"></i></button>
                        </div>
                    </div>
                `;
            return html;
        }

        function buildMockHtml(data, t) {
            const questions = data.questions;
            let timerHtml = '';
            if (data.timerEnabled) {
                const total = data.timerSeconds * questions.length;
                timerHtml =
                    `<div class="timer-badge total-timer" id="mockTotalTimer">⏱️ ${formatTime(total)}</div>`;
            }
            let html = `
                    <div style="background:${t.bg};border-radius:20px;padding:14px;border:1px solid ${t.border};">
                        <div class="mock-header-sticky" style="background:${t.cardBg};">
                            <div class="mock-header-top">
                                <div style="display:flex;align-items:center;gap:6px;">
                                    ${data.logo ? `<img src="${data.logo}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">` : ''}
                                    <span style="font-weight:600;color:${t.text};font-size:0.85rem;">${data.title}</span>
                                </div>
                                <div class="mock-header-actions">
                                    ${timerHtml}
                                    <button id="submitMockBtn" class="btn btn-success btn-sm"><i class="fas fa-check-double"></i> Submit</button>
                                </div>
                            </div>
                            <div class="booklet-wrap" style="position:static;box-shadow:none;padding:3px 0;border-bottom:none;">
                                <div class="booklet" id="mockBookNav"></div>

                                <span id="mockAnsweredCount">0 / ${questions.length} answered</span>
                                <span id="mockProgressText">0%</span>
                            </div>
                            <div class="progress-bar" style="margin:4px 0 0;"><div id="mockProgressFill" class="progress-fill" style="width:0%;"></div></div>
