<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>QuizCraft — Create & Share Custom Quizzes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        .app-full {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 10px 8px;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.02);
            padding: 20px 16px;
            margin-bottom: 14px;
            transition: all 0.2s;
        }
        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f1f3f4;
            color: #1e293b;
        }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-primary:hover { background: #1557b0; transform: translateY(-1px); }
        .btn-success { background: #0f9d58; color: white; }
        .btn-outline { background: transparent; border: 1px solid #dadce0; }
        .upload-area {
            border: 2px dashed #dadce0;
            border-radius: 20px;
            background: #fafafa;
            padding: 20px;
            text-align: center;
            margin: 12px 0;
        }
        .error-line {
            background: #fce8e6;
            border-left: 4px solid #d93025;
            padding: 8px 12px;
            border-radius: 12px;
            margin: 6px 0;
            font-size: 0.75rem;
        }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .grid-2col { grid-template-columns: 1fr; } .card { padding: 16px; } }
        
        /* Template scroll */
        .template-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 0 16px;
            margin: 8px 0;
            scrollbar-width: thin;
        }
        .template-item {
            background: #f8f9fa;
            border-radius: 60px;
            padding: 8px 18px;
            font-size: 0.8rem;
            white-space: nowrap;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .template-item.active { border-color: #1a73e8; background: #e8f0fe; }
        .template-item i { margin-right: 6px; }
        
        .input-group { margin: 14px 0; }
        .input-label { font-size: 0.75rem; font-weight: 600; color: #5f6368; margin-bottom: 6px; display: block; }
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 16px;
            font-size: 0.9rem;
            transition: 0.2s;
            font-family: 'Inter', monospace;
        }
        .input-field:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
        textarea.input-field { resize: vertical; min-height: 100px; }
        
        /* Quiz/Mock styling */
        .question-card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #ecedef;
        }
        .option-row {
            background: #f8f9fa;
            border-radius: 60px;
            padding: 12px 18px;
            margin: 10px 0;
            border: 1px solid #ecedef;
            cursor: pointer;
            transition: 0.15s;
            font-weight: 500;
        }
        .option-row.correct-feedback { background: #e6f4ea; border-color: #0f9d58; }
        .option-row.wrong-feedback { background: #fce8e6; border-color: #d93025; }
        .highlight-correct { background: #e6f4ea !important; border-color: #0f9d58 !important; }
        
        .progress-bar { background: #ecedef; border-radius: 100px; height: 6px; overflow: hidden; margin: 16px 0; }
        .progress-fill { background: #1a73e8; width: 0%; height: 100%; transition: width 0.3s; }
        
        .booklet {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 14px 0;
            justify-content: center;
        }
        .booklet-btn {
            width: 34px;
            height: 34px;
            border-radius: 34px;
            background: #f1f3f4;
            border: none;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .booklet-btn.answered { background: #1a73e8; color: white; }
        
        .timer-badge {
            background: #1e293b;
            color: white;
            padding: 5px 12px;
            border-radius: 40px;
            font-family: monospace;
            font-weight: 600;
            font-size: 0.8rem;
            display: inline-block;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top:0;left:0;
            width:100%;height:100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            z-index: 2000;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-card {
            background: white;
            border-radius: 32px;
            max-width: 480px;
            width: 90%;
            padding: 24px;
            text-align: center;
            animation: popIn 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .recap-item {
            background: #fef7e0;
            border-radius: 16px;
            padding: 12px;
            margin: 10px 0;
            text-align: left;
        }
        .recap-item.correct-recap { background: #e6f4ea; border-left: 4px solid #0f9d58; }
        .recap-item.wrong-recap { background: #fce8e6; border-left: 4px solid #d93025; }
        
        /* Simple link button */
        .copy-link-btn {
            background: #e8eaed;
            border-radius: 60px;
            padding: 8px 18px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .quiz-name-input { font-size: 1.3rem; font-weight: 600; border: none; border-bottom: 2px solid #dadce0; padding: 6px 0; width: 100%; outline: none; background: transparent; }
        .logo-preview { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        
        /* animation */
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .question-card { animation: fadeSlideUp 0.25s ease; }
    </style>
</head>
<body>
<div class="app-full" id="app">
    <!-- STEP 1: TEACHER DASHBOARD - UPLOAD -->
    <div id="stepUpload" class="card">
        <div class="flex-between">
            <input type="text" id="quizNameInput" class="quiz-name-input" placeholder="Quiz Title" value="My Custom Quiz">
            <label for="logoUpload" style="cursor:pointer;"><i class="fas fa-camera"></i> Logo</label>
            <input type="file" id="logoUpload" accept="image/*" style="display:none">
        </div>
        <div id="logoPreview" style="margin-bottom: 8px;"></div>
        
        <div class="input-group">
            <label class="input-label"><i class="fas fa-upload"></i> Bulk Upload Questions</label>
            <div class="upload-area" id="dropzone">
                <i class="fas fa-cloud-upload-alt fa-2x" style="color:#1a73e8;"></i>
                <p style="font-size:0.8rem;">Drag / click (.csv, .xlsx, .txt)</p>
                <input type="file" id="fileInput" accept=".csv,.xlsx,.txt" style="display:none">
                <button class="btn btn-outline" id="chooseFileBtn" style="margin-top:6px;"><i class="fas fa-folder-open"></i> Browse</button>
            </div>
        </div>
        
        <div class="input-group">
            <label class="input-label"><i class="fas fa-paste"></i> Or paste text (CSV format)</label>
            <textarea id="bulkTextArea" class="input-field" rows="4" placeholder="Question? ,Option A, Option B, Option C, Option D, Correct Answer&#10;Amazon longest river? ,Nile, Amazon, Ganga, Yangtze, Amazon&#10;Who wrote Gitanjali? ,Tagore, Shakespeare, Dickens, Tolstoy, Tagore&#10;Capital of India? ,Delhi, Mumbai, Kolkata, Chennai, Delhi"></textarea>
        </div>
        <div id="validationErrors"></div>
        <div id="parsedPreview"></div>
        <button id="nextToTypeBtn" class="btn btn-primary" style="width:100%; margin-top:12px;" disabled>Next: Choose Template & Mode →</button>
    </div>

    <!-- STEP 2: TEMPLATES + MODE + TIMER OPTIONS -->
    <div id="stepType" style="display:none;" class="card">
        <h3 style="font-size:1.1rem; margin-bottom:8px;">✨ Choose Theme</h3>
        <div class="template-scroll" id="templateList">
            <div class="template-item" data-template="default">🌿 Default</div>
            <div class="template-item" data-template="ocean">🌊 Ocean</div>
            <div class="template-item" data-template="forest">🌲 Forest</div>
            <div class="template-item" data-template="sunset">🌅 Sunset</div>
            <div class="template-item" data-template="lavender">💜 Lavender</div>
            <div class="template-item" data-template="coffee">☕ Coffee</div>
            <div class="template-item" data-template="rose">🌹 Rose</div>
            <div class="template-item" data-template="sky">☁️ Sky</div>
            <div class="template-item" data-template="peach">🍑 Peach</div>
            <div class="template-item" data-template="mint">🍃 Mint</div>
            <div class="template-item" data-template="golden">✨ Golden</div>
            <div class="template-item" data-template="mono">⚪ Mono</div>
        </div>
        
        <div class="flex-between" style="margin: 16px 0;">
            <button id="chooseQuizBtn" class="btn btn-primary"><i class="fas fa-play"></i> Quiz Mode</button>
            <button id="chooseMockBtn" class="btn btn-outline"><i class="fas fa-clock"></i> Mocktest Mode</button>
        </div>
        
        <!-- Timer Options for Both Modes -->
        <div style="background:#f8f9fa; border-radius:20px; padding:14px; margin:12px 0;">
            <div class="flex-between">
                <label><i class="fas fa-hourglass-half"></i> Enable Timer</label>
                <div><input type="checkbox" id="enableTimerCheck"> <span style="font-size:0.75rem;">(Quiz & Mocktest)</span></div>
            </div>
            <div class="flex-between" style="margin-top:10px;">
                <label>Seconds per question:</label>
                <input type="number" id="timerSeconds" value="30" min="5" max="300" style="width:100px; border-radius:30px; padding:6px;" disabled>
            </div>
            <small style="color:#5f6368;">Timer applies to each question. Auto-submit if time runs out.</small>
        </div>
        
        <button id="finalCreateBtn" class="btn btn-success" style="width:100%;"><i class="fas fa-check-circle"></i> Create Assessment</button>
    </div>

    <!-- STEP 3: SHARE BUTTON + PLAY AREA -->
    <div id="createdArea" style="display:none;" class="card">
        <div class="flex-between" style="margin-bottom: 12px;">
            <span style="font-size:0.8rem; color:#5f6368;"><i class="fas fa-link"></i> Share this quiz</span>
            <div class="copy-link-btn" id="copyLinkBtn">
                <i class="fas fa-copy"></i> Copy Short Link
            </div>
        </div>
        <div id="renderZone" style="margin-top: 8px; width:100%;"></div>
    </div>
</div>

<script>
    // ---------- GLOBAL ----------
    let questionsBank = [];
    let currentMode = "quiz";
    let finalQuestions = [];
    let userAnswers = [];
    let mockAnswers = [];
    let selectedTemplate = "default";
    let timerEnabled = false;
    let timerSeconds = 30;
    let timerInterval = null;
    let quizLogo = null;
    let quizTitle = "My Custom Quiz";
    let currentShortLink = "";
    
    // 12 Templates
    const templates = {
        default: { bg: "#ffffff", cardBg: "#ffffff", accent: "#1a73e8", text: "#202124", border: "#ecedef", optionBg: "#f8f9fa" },
        ocean: { bg: "#e8f4f8", cardBg: "#ffffff", accent: "#0077b6", text: "#023e8a", border: "#caf0f8", optionBg: "#f0f9ff" },
        forest: { bg: "#eaf4e4", cardBg: "#ffffff", accent: "#2e7d32", text: "#1b5e20", border: "#c8e6c9", optionBg: "#f1f8e9" },
        sunset: { bg: "#fff3e0", cardBg: "#ffffff", accent: "#e65100", text: "#bf360c", border: "#ffe0b2", optionBg: "#fff8e1" },
        lavender: { bg: "#f3e5f5", cardBg: "#ffffff", accent: "#7b1fa2", text: "#4a148c", border: "#e1bee7", optionBg: "#fce4ec" },
        coffee: { bg: "#f5f0e6", cardBg: "#ffffff", accent: "#8d6e63", text: "#4e342e", border: "#d7ccc8", optionBg: "#faf0e6" },
        rose: { bg: "#fef2f2", cardBg: "#ffffff", accent: "#e11d48", text: "#881337", border: "#ffe4e6", optionBg: "#fff1f2" },
        sky: { bg: "#e0f2fe", cardBg: "#ffffff", accent: "#0284c7", text: "#0c4a6e", border: "#bae6fd", optionBg: "#f0f9ff" },
        peach: { bg: "#ffedd5", cardBg: "#ffffff", accent: "#ea580c", text: "#7c2d12", border: "#fed7aa", optionBg: "#fff7ed" },
        mint: { bg: "#dcfce7", cardBg: "#ffffff", accent: "#16a34a", text: "#14532d", border: "#bbf7d0", optionBg: "#f0fdf4" },
        golden: { bg: "#fef9c3", cardBg: "#ffffff", accent: "#ca8a04", text: "#713f12", border: "#fde047", optionBg: "#fefce8" },
        mono: { bg: "#f1f5f9", cardBg: "#ffffff", accent: "#475569", text: "#1e293b", border: "#e2e8f0", optionBg: "#f8fafc" }
    };
    
    function applyTemplate() {
        const t = templates[selectedTemplate];
        document.body.style.background = t.bg;
        const cards = document.querySelectorAll(".card");
        cards.forEach(c => { c.style.backgroundColor = t.cardBg; c.style.borderColor = t.border; });
    }
    
    // Parse bulk
    function parseBulkToQuestions(raw) {
        const lines = raw.split(/\r?\n/);
        let questions = [], errors = [];
        for(let i=0; i<lines.length; i++) {
            let line = lines[i].trim();
            if(!line) continue;
            let parts = line.split(',').map(s=>s.trim());
            if(parts.length < 6) { errors.push(`Line ${i+1}: need Question, 4 options, Correct`); continue; }
            let qText = parts[0];
            let opts = parts.slice(1,5);
            let correct = parts[5];
            let image = (parts.length > 6 && parts[6].startsWith("http")) ? parts[6] : null;
            if(!qText || opts.some(o=>!o) || !correct) { errors.push(`Line ${i+1}: invalid data`); continue; }
            questions.push({ text: qText, options: opts, correct: correct, image: image });
        }
        return {questions, errors};
    }
    
    function renderPreview(questions, errDiv) {
        let previewDiv = document.getElementById("parsedPreview");
        if(!questions.length){ previewDiv.innerHTML="<div class='error-line'>No valid questions</div>"; return false; }
        let html = `<div style="max-height:160px; overflow:auto;"><strong>✅ ${questions.length} questions loaded</strong><br/>`;
        questions.forEach((q,idx)=>{
            html += `<div style="background:#f8f9fa; border-radius:12px; padding:6px 10px; margin:6px 0;"><b>${idx+1}. ${q.text.substring(0,50)}</b> <button class="btn btn-outline addImgBtn" data-idx="${idx}" style="padding:2px 8px; font-size:0.7rem;"><i class="fas fa-image"></i></button></div>`;
        });
        html+=`</div>`;
        previewDiv.innerHTML = html;
        document.querySelectorAll('.addImgBtn').forEach(btn=>{
            btn.addEventListener('click',(e)=>{
                let idx = parseInt(btn.dataset.idx);
                let url = prompt("Image URL (jpg/png):");
                if(url) questions[idx].image = url;
                renderPreview(questions, errDiv);
            });
        });
        return true;
    }
    
    function updateNext() { document.getElementById("nextToTypeBtn").disabled = questionsBank.length === 0; }
    function processBulk() {
        let raw = document.getElementById("bulkTextArea").value;
        let {questions, errors} = parseBulkToQuestions(raw);
        let errDiv = document.getElementById("validationErrors");
        errDiv.innerHTML = errors.map(e=>`<div class="error-line">⚠️ ${e}</div>`).join('');
        if(questions.length) { questionsBank = questions; renderPreview(questionsBank, errDiv); updateNext(); }
        else { questionsBank = []; updateNext(); errDiv.innerHTML+="<div class='error-line'>Invalid format</div>"; }
    }
    
    document.getElementById("chooseFileBtn").onclick = () => document.getElementById("fileInput").click();
    document.getElementById("fileInput").onchange = (e) => {
        let file = e.target.files[0];
        if(!file) return;
        let reader = new FileReader();
        reader.onload = (ev) => {
            if(file.name.endsWith('.xlsx')) {
                let data = new Uint8Array(ev.target.result);
                let workbook = XLSX.read(data, {type: 'array'});
                let sheet = workbook.Sheets[workbook.SheetNames[0]];
                let rows = XLSX.utils.sheet_to_json(sheet, {header:1});
                let csv = rows.map(r=>r.join(',')).join('\n');
                document.getElementById("bulkTextArea").value = csv;
                processBulk();
            } else {
                document.getElementById("bulkTextArea").value = ev.target.result;
                processBulk();
            }
        };
        if(file.name.endsWith('.xlsx')) reader.readAsArrayBuffer(file);
        else reader.readAsText(file);
    };
    document.getElementById("bulkTextArea").addEventListener("input", processBulk);
    processBulk();
    
    document.getElementById("nextToTypeBtn").onclick = () => {
        if(questionsBank.length===0) return;
        quizTitle = document.getElementById("quizNameInput").value || "My Quiz";
        document.getElementById("stepUpload").style.display = "none";
        document.getElementById("stepType").style.display = "block";
        applyTemplate();
    };
    
    // Logo
    document.getElementById("logoUpload").onchange = (e) => {
        let file = e.target.files[0];
        if(file) {
            let reader = new FileReader();
            reader.onload = (ev) => { quizLogo = ev.target.result; document.getElementById("logoPreview").innerHTML = `<img src="${quizLogo}" class="logo-preview">`; };
            reader.readAsDataURL(file);
        }
    };
    
    // Template selector
    document.querySelectorAll(".template-item").forEach(el => {
        el.addEventListener("click", () => {
            document.querySelectorAll(".template-item").forEach(t=>t.classList.remove("active"));
            el.classList.add("active");
            selectedTemplate = el.dataset.template;
            applyTemplate();
        });
    });
    
    document.getElementById("chooseQuizBtn").onclick = () => { currentMode="quiz"; document.getElementById("chooseQuizBtn").classList.add("btn-primary"); document.getElementById("chooseMockBtn").classList.remove("btn-primary"); document.getElementById("chooseMockBtn").classList.add("btn-outline"); };
    document.getElementById("chooseMockBtn").onclick = () => { currentMode="mock"; document.getElementById("chooseMockBtn").classList.add("btn-primary"); document.getElementById("chooseQuizBtn").classList.remove("btn-primary"); document.getElementById("chooseQuizBtn").classList.add("btn-outline"); };
    
    // Timer checkbox logic
    const enableTimerCheck = document.getElementById("enableTimerCheck");
    const timerSecInput = document.getElementById("timerSeconds");
    enableTimerCheck.onchange = () => { timerSecInput.disabled = !enableTimerCheck.checked; };
    
    // Short link generator using localStorage
    function generateAndSaveShortLink(assessmentData) {
        const jsonStr = JSON.stringify(assessmentData);
        const encoded = btoa(encodeURIComponent(jsonStr));
        let shortId = Math.random().toString(36).substring(2, 10);
        let fullShort = `${window.location.origin}${window.location.pathname}?q=${shortId}`;
        let mapping = JSON.parse(localStorage.getItem("quizShortLinks") || "{}");
        mapping[shortId] = encoded;
        localStorage.setItem("quizShortLinks", JSON.stringify(mapping));
        return { shortUrl: fullShort, shortId };
    }
    
    // FINAL CREATE
    document.getElementById("finalCreateBtn").onclick = () => {
        if(questionsBank.length===0) return alert("Please load questions first");
        finalQuestions = JSON.parse(JSON.stringify(questionsBank));
        userAnswers = new Array(finalQuestions.length).fill(null);
        mockAnswers = new Array(finalQuestions.length).fill(null);
        
        timerEnabled = enableTimerCheck.checked;
        timerSeconds = parseInt(timerSecInput.value) || 30;
        
        const assessmentData = { 
            q: finalQuestions, 
            mode: currentMode, 
            template: selectedTemplate, 
            quizTitle: quizTitle, 
            quizLogo: quizLogo,
            timerEnabled: timerEnabled,
            timerSeconds: timerSeconds
        };
        
        const { shortUrl, shortId } = generateAndSaveShortLink(assessmentData);
        currentShortLink = shortUrl;
        
        document.getElementById("createdArea").style.display = "block";
        document.getElementById("stepType").style.display = "none";
        
        // Set copy button
        const copyBtn = document.getElementById("copyLinkBtn");
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(shortUrl);
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => { copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy Short Link'; }, 2000);
        };
        
        // Render the assessment for teacher preview (same as student will see)
        renderAssessmentFromData(assessmentData);
    };
    
    function renderAssessmentFromData(data) {
        const container = document.getElementById("renderZone");
        const t = templates[data.template];
        let headerHtml = `<div style="display:flex; align-items:center; gap:10px; margin-bottom:20px; padding-bottom:10px; border-bottom:2px solid ${t.border}">
            ${data.quizLogo ? `<img src="${data.quizLogo}" style="width:40px; height:40px; border-radius:50%;">` : `<i class="fas fa-clipboard-list" style="font-size:28px; color:${t.accent}"></i>`}
            <h2 style="font-size:1.3rem; font-weight:500; color:${t.text};">${data.quizTitle}</h2>
        </div>`;
        if(data.mode === "quiz") renderQuizInterface(data.q, t, headerHtml, data.timerEnabled, data.timerSeconds);
        else renderMockInterface(data.q, t, headerHtml, data.timerEnabled, data.timerSeconds);
    }
    
    // QUIZ RENDER (with optional timer)
    function renderQuizInterface(questions, themeObj, headerHtml, hasTimer, timerSec) {
        let container = document.getElementById("renderZone");
        container.innerHTML = `<div style="background:${themeObj.bg}; border-radius:24px; padding:16px;">
            ${headerHtml}
            <div class="booklet" id="quizBookNav"></div>
            <div id="quizSlides"></div>
            <div class="progress-bar"><div id="quizProgressFill" class="progress-fill"></div></div>
            <div class="flex-between" style="margin-top:16px;"><button id="quizPrevBtn" class="btn btn-outline">◀ Previous</button><button id="quizNextBtn" class="btn btn-primary">Next ▶</button></div>
        </div>`;
        let bookletDiv = document.getElementById("quizBookNav");
        let slidesContainer = document.getElementById("quizSlides");
        let slides = [];
        let answersLocal = new Array(questions.length).fill(null);
        let currentTimerInterval = null;
        
        for(let i=0;i<questions.length;i++) {
            let btn = document.createElement("button");
            btn.innerText = i+1;
            btn.classList.add("booklet-btn");
            btn.addEventListener("click",()=> showSlide(i));
            bookletDiv.appendChild(btn);
        }
        
        questions.forEach((q, idx)=>{
            let slide = document.createElement("div");
            slide.className = "question-card";
            slide.style.backgroundColor = themeObj.cardBg;
            slide.style.display = idx===0 ? "block" : "none";
            let timerHtml = hasTimer ? `<div class="timer-badge" style="background:#1a73e8; margin-bottom:12px;" id="qTimer_${idx}">⏱️ ${timerSec}s left</div>` : "";
            slide.innerHTML = `${timerHtml}<h4 style="color:${themeObj.accent}; margin-bottom:12px;">📌 ${idx+1}. ${q.text}</h4>${q.image ? `<img src="${q.image}" style="max-width:100%; max-height:130px; border-radius:16px; margin:8px 0;">` : ""}<div class="options-area"></div>`;
            let optsDiv = slide.querySelector(".options-area");
            q.options.forEach(opt => {
                let optDiv = document.createElement("div");
                optDiv.className = "option-row";
                optDiv.innerText = opt;
                optDiv.addEventListener("click", () => {
                    if(answersLocal[idx] === null) {
                        answersLocal[idx] = opt;
                        updateFeedback(slide, opt, q.correct);
                        updateBookletState(idx, true);
                        updateProgress();
                        if(hasTimer && currentTimerInterval) clearInterval(currentTimerInterval);
                    }
                });
                optsDiv.appendChild(optDiv);
            });
            slidesContainer.appendChild(slide);
            slides.push(slide);
        });
        
        let currentIdx = 0;
        function startTimerForSlide(idx) {
            if(!hasTimer) return;
            if(currentTimerInterval) clearInterval(currentTimerInterval);
            let timeLeft = timerSec;
            let timerSpan = document.getElementById(`qTimer_${idx}`);
            if(timerSpan) timerSpan.innerText = `⏱️ ${timeLeft}s left`;
            currentTimerInterval = setInterval(() => {
                if(timeLeft <= 1) {
                    clearInterval(currentTimerInterval);
                    if(answersLocal[idx] === null) {
                        answersLocal[idx] = "⏰ Time's up (No answer)";
                        let slideDiv = slides[idx];
                        updateFeedback(slideDiv, null, questions[idx].correct, true);
                        updateBookletState(idx, true);
                        updateProgress();
                    }
                    if(timerSpan) timerSpan.innerText = `⏰ Time's up!`;
                } else {
                    timeLeft--;
                    if(timerSpan) timerSpan.innerText = `⏱️ ${timeLeft}s left`;
                }
            }, 1000);
        }
        
        function showSlide(index) {
            slides.forEach((s,i)=> s.style.display = i===index ? "block" : "none");
            currentIdx = index;
            if(hasTimer && answersLocal[index] === null) startTimerForSlide(index);
            else if(hasTimer && answersLocal[index] !== null) { if(currentTimerInterval) clearInterval(currentTimerInterval); }
        }
        
        function updateBookletState(idx, answered){ let btns = bookletDiv.querySelectorAll(".booklet-btn"); if(answered) btns[idx].classList.add("answered"); else btns[idx].classList.remove("answered"); }
        function updateProgress(){ let answeredCount = answersLocal.filter(a=>a!==null).length; let percent = (answeredCount/questions.length)*100; document.getElementById("quizProgressFill").style.width = percent+"%"; for(let i=0;i<questions.length;i++) updateBookletState(i, answersLocal[i]!==null); }
        function updateFeedback(slideDiv, selected, correct, timeoutFlag=false){ let opts = slideDiv.querySelectorAll(".option-row"); opts.forEach(opt => { if(opt.innerText === correct) opt.classList.add("highlight-correct"); if(selected && opt.innerText === selected && selected !== correct) opt.classList.add("wrong-feedback"); if(selected && opt.innerText === selected && selected === correct) opt.classList.add("correct-feedback"); }); if(timeoutFlag && !selected) slideDiv.querySelectorAll(".option-row").forEach(opt => { if(opt.innerText === correct) opt.classList.add("highlight-correct"); }); }
        
        document.getElementById("quizPrevBtn").onclick = () => { if(currentIdx>0) showSlide(currentIdx-1); };
        document.getElementById("quizNextBtn").onclick = () => { if(currentIdx < questions.length-1) showSlide(currentIdx+1); else if(currentIdx === questions.length-1) { if(currentTimerInterval) clearInterval(currentTimerInterval); showScoreModal("quiz", answersLocal, questions); } };
        showSlide(0);
    }
    
    // MOCK RENDER (scroll view with optional timer)
    function renderMockInterface(questions, themeObj, headerHtml, hasTimer, timerSec) {
        let container = document.getElementById("renderZone");
        let totalTime = questions.length * timerSec;
        let timeLeft = totalTime;
        let answersMock = new Array(questions.length).fill(null);
        let globalTimerInterval = null;
        
        container.innerHTML = `<div style="background:${themeObj.bg}; border-radius:24px; padding:16px;">
            ${headerHtml}
            <div class="flex-between"><div class="timer-badge" id="mockTimerDisplay"><i class="far fa-clock"></i> ${formatTime(timeLeft)}</div>
            <div class="booklet" id="mockBookNav"></div></div>
            <div id="mockQuestionsList" style="max-height:520px; overflow-y:auto; margin-top:16px;"></div>
            <button id="submitMockFinalBtn" class="btn btn-success" style="width:100%; margin-top:16px;"><i class="fas fa-check-double"></i> Submit Mocktest</button>
        </div>`;
        
        let bookletDiv = document.getElementById("mockBookNav");
        for(let i=0;i<questions.length;i++){
            let btn = document.createElement("button");
            btn.innerText = i+1;
            btn.classList.add("booklet-btn");
            btn.addEventListener("click",()=>{ document.getElementById("mockQuestionsList").scrollTo({top: i*320, behavior:"smooth"}); });
            bookletDiv.appendChild(btn);
        }
        
        let questionsDiv = document.getElementById("mockQuestionsList");
        questions.forEach((q, idx)=>{
            let qCard = document.createElement("div");
            qCard.className = "question-card";
            qCard.style.backgroundColor = themeObj.cardBg;
            let timerHtml = hasTimer ? `<div class="timer-badge" style="background:#e2e8f0; color:#1e293b; margin-bottom:12px;" id="mockQTimer_${idx}">⏱️ ${timerSec}s</div>` : "";
            qCard.innerHTML = `${timerHtml}<h4 style="color:${themeObj.accent}">📖 ${idx+1}. ${q.text}</h4>${q.image ? `<img src="${q.image}" style="max-width:100px; border-radius:12px;">` : ""}<div class="mock-options"></div>`;
            let optsDiv = qCard.querySelector(".mock-options");
            q.options.forEach(opt => {
                let radioLabel = document.createElement("label");
                radioLabel.style.display = "flex"; radioLabel.style.alignItems="center"; radioLabel.style.gap="12px"; radioLabel.style.margin="12px 0";
                radioLabel.innerHTML = `<input type="radio" name="mock_q_${idx}" value="${opt}"> <span>${opt}</span>`;
                radioLabel.querySelector("input").addEventListener("change", (e) => {
                    answersMock[idx] = e.target.value;
                    let btns = bookletDiv.querySelectorAll(".booklet-btn");
                    if(answersMock[idx]) btns[idx].classList.add("answered");
                    else btns[idx].classList.remove("answered");
                    if(hasTimer && timerPerQuestionIntervals[idx]) clearInterval(timerPerQuestionIntervals[idx]);
                });
                optsDiv.appendChild(radioLabel);
            });
            questionsDiv.appendChild(qCard);
        });
        
        // Per-question timers for mock
        let timerPerQuestionIntervals = [];
        if(hasTimer) {
            questions.forEach((_, idx) => {
                let timeLeftQ = timerSec;
                let timerSpan = document.getElementById(`mockQTimer_${idx}`);
                if(timerSpan) timerSpan.innerText = `⏱️ ${timeLeftQ}s`;
                let interval = setInterval(() => {
                    if(timeLeftQ <= 1) {
                        clearInterval(interval);
                        if(answersMock[idx] === null) {
                            answersMock[idx] = "⏰ Time's up";
                            let btns = bookletDiv.querySelectorAll(".booklet-btn");
                            btns[idx].classList.add("answered");
                        }
                        if(timerSpan) timerSpan.innerText = `⏰ Expired`;
                    } else {
                        timeLeftQ--;
                        if(timerSpan && answersMock[idx] === null) timerSpan.innerText = `⏱️ ${timeLeftQ}s`;
                    }
                }, 1000);
                timerPerQuestionIntervals.push(interval);
            });
        }
        
        // Overall timer (optional)
        if(hasTimer) {
            globalTimerInterval = setInterval(() => {
                if(timeLeft <= 1) {
                    clearInterval(globalTimerInterval);
                    timerPerQuestionIntervals.forEach(clearInterval);
                    alert("Time's up! Submitting mock test.");
                    showScoreModal("mock", answersMock, questions);
                } else {
                    timeLeft--;
                    document.getElementById("mockTimerDisplay").innerHTML = `<i class="far fa-clock"></i> ${formatTime(timeLeft)}`;
                }
            }, 1000);
        }
        
        document.getElementById("submitMockFinalBtn").onclick = () => {
            if(globalTimerInterval) clearInterval(globalTimerInterval);
            timerPerQuestionIntervals.forEach(clearInterval);
            showScoreModal("mock", answersMock, questions);
        };
    }
    
    function formatTime(sec){ let m=Math.floor(sec/60); let s=sec%60; return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    
    function showScoreModal(mode, answersArr, questions) {
        let results = [];
        questions.forEach((q,i) => { let isCorrect = (answersArr[i] === q.correct); results.push({ question: q.text, userAnswer: answersArr[i] || "Not answered", correctAnswer: q.correct, isCorrect: isCorrect, image: q.image }); });
        let correctCount = results.filter(r=>r.isCorrect).length;
        let percent = (correctCount/questions.length)*100;
        let modal = document.createElement("div");
        modal.className = "modal-overlay active";
        modal.innerHTML = `<div class="modal-card"><h2 style="color:${templates[selectedTemplate].accent}"><i class="fas fa-chart-simple"></i> Your Score</h2>
        <div style="position:relative; width:140px; margin:0 auto;"><canvas id="scoreCanvas" width="140" height="140"></canvas><div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.6rem; font-weight:700;">${Math.round(percent)}<span style="font-size:0.8rem;">%</span></div></div>
        <p style="font-size:1.2rem; font-weight:600;">${correctCount}/${questions.length} correct</p>
        <div class="flex-between mt-3"><button id="recapBtn" class="btn btn-outline"><i class="fas fa-list-ul"></i> Full Recap</button><button id="closeScoreBtn" class="btn btn-primary">Close</button></div></div>`;
        document.body.appendChild(modal);
        let ctx = document.getElementById("scoreCanvas").getContext("2d");
        new Chart(ctx, { type: 'doughnut', data: { labels: ['Correct', 'Wrong'], datasets: [{ data: [correctCount, questions.length-correctCount], backgroundColor: ['#0f9d58', '#d93025'], borderWidth: 0, cutout: '65%' }] }, options: { responsive: true, plugins: { legend: { display: false } } } });
        document.getElementById("recapBtn").onclick = () => showFullRecap(results);
        document.getElementById("closeScoreBtn").onclick = () => modal.remove();
    }
    
    function showFullRecap(results) {
        let recapModal = document.createElement("div");
        recapModal.className = "modal-overlay active";
        let html = `<div class="modal-card" style="max-width:600px; max-height:70vh; overflow:auto;"><h3><i class="fas fa-receipt"></i> Detailed Recap</h3>`;
        results.forEach(r => {
            let statusClass = r.isCorrect ? "correct-recap" : "wrong-recap";
            let icon = r.isCorrect ? "✅" : "❌";
            html += `<div class="recap-item ${statusClass}"><strong>${icon} ${r.question}</strong><br/><span>Your answer: ${r.userAnswer}</span><br/><span>Correct: ${r.correctAnswer}</span>${r.image ? `<br/><img src="${r.image}" style="max-width:70px;">` : ""}</div>`;
        });
        html += `<button id="closeRecapFinal" class="btn btn-primary mt-3">Close</button></div>`;
        recapModal.innerHTML = html;
        document.body.appendChild(recapModal);
        document.getElementById("closeRecapFinal").onclick = () => recapModal.remove();
    }
    
    // RESOLVE SHARED LINK - Only show the quiz, no creation UI
    function resolveAndShowSharedQuiz() {
        const params = new URLSearchParams(window.location.search);
        const shortId = params.get("q");
        if(shortId) {
            let mapping = JSON.parse(localStorage.getItem("quizShortLinks") || "{}");
            let encoded = mapping[shortId];
            if(encoded) {
                try {
                    let data = JSON.parse(decodeURIComponent(atob(encoded)));
                    if(data.q && data.q.length) {
                        // Hide all creation UI, show only quiz
                        document.getElementById("stepUpload").style.display = "none";
                        document.getElementById("stepType").style.display = "none";
                        document.getElementById("createdArea").style.display = "block";
                        selectedTemplate = data.template || "default";
                        applyTemplate();
                        renderAssessmentFromData(data);
                        // Hide share button for students
                        const copyBtn = document.getElementById("copyLinkBtn");
                        if(copyBtn) copyBtn.style.display = "none";
                        const shareDiv = document.querySelector("#createdArea .flex-between");
                        if(shareDiv) shareDiv.style.display = "none";
                    }
                } catch(e) { console.log("error loading shared quiz"); }
            }
        }
    }
    
    window.onload = () => {
        document.querySelector(".template-item[data-template='default']").classList.add("active");
        resolveAndShowSharedQuiz();
    };
</script>
