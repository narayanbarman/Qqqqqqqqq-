    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            transition: background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        /* ── Font classes ── */
        .font-inter {
            font-family: 'Inter', sans-serif;
        }
        .font-roboto {
            font-family: 'Roboto', sans-serif;
        }
        .font-open-sans {
            font-family: 'Open Sans', sans-serif;
        }
        .font-lato {
            font-family: 'Lato', sans-serif;
        }
        .font-montserrat {
            font-family: 'Montserrat', sans-serif;
        }
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }
        .font-nunito {
            font-family: 'Nunito', sans-serif;
        }
        .font-raleway {
            font-family: 'Raleway', sans-serif;
        }
        .font-merriweather {
            font-family: 'Merriweather', serif;
        }
        .font-playfair-display {
            font-family: 'Playfair Display', serif;
        }
        .font-oswald {
            font-family: 'Oswald', sans-serif;
        }
        .font-quicksand {
            font-family: 'Quicksand', sans-serif;
        }
        .font-work-sans {
            font-family: 'Work Sans', sans-serif;
        }
        .font-source-sans-pro {
            font-family: 'Source Sans Pro', sans-serif;
        }
        .font-roboto-condensed {
            font-family: 'Roboto Condensed', sans-serif;
        }
        .font-pt-sans {
            font-family: 'PT Sans', sans-serif;
        }
        .font-rubik {
            font-family: 'Rubik', sans-serif;
        }
        .font-barlow {
            font-family: 'Barlow', sans-serif;
        }
        .font-fira-sans {
            font-family: 'Fira Sans', sans-serif;
        }
        .font-karla {
            font-family: 'Karla', sans-serif;
        }
        .font-noto-sans-bengali {
            font-family: 'Noto Sans Bengali', sans-serif;
        }
        .font-hind-siliguri {
            font-family: 'Hind Siliguri', sans-serif;
        }
        .font-noto-serif-bengali {
            font-family: 'Noto Serif Bengali', serif;
        }
        .font-tiro-bangla {
            font-family: 'Tiro Bangla', serif;
        }
        .font-anek-bengali {
            font-family: 'Anek Bengali', sans-serif;
        }
        /* Ensure all text elements inherit the font */
        [class*="font-"] * {
            font-family: inherit;
        }

        .app-full {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 6px 4px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 14px 12px;
            margin-bottom: 10px;
            border: none;
        }
        .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f3f4;
            color: #1e293b;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: #1a73e8;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1557b0;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.35);
        }
        .btn-success {
            background: #0f9d58;
            color: #fff;
        }
        .btn-success:hover {
            background: #0d7a45;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 157, 88, 0.35);
        }
        .btn-danger {
            background: #d93025;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b71c1c;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #dadce0;
        }
        .btn-outline:hover {
            background: #f1f3f4;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 0.7rem;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        .upload-area {
            border: 2px dashed #dadce0;
            border-radius: 16px;
            background: #fafafa;
            padding: 16px;
            text-align: center;
            margin: 10px 0;
            transition: 0.2s;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #1a73e8;
            background: #f0f7ff;
        }
        .error-line {
            background: #fce8e6;
            border-left: 4px solid #d93025;
            padding: 6px 10px;
            border-radius: 10px;
            margin: 4px 0;
            font-size: 0.7rem;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        @media (max-width: 600px) {
            .card {
                padding: 12px 10px;
            }
            .app-full {
                padding: 4px 2px;
            }
        }
        .template-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 0 12px;
            margin: 6px 0;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .template-item {
            background: #f8f9fa;
            border-radius: 60px;
            padding: 6px 14px;
            font-size: 0.75rem;
            white-space: nowrap;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            flex-shrink: 0;
            font-family: 'Inter', sans-serif;
        }
        .template-item.active {
            border-color: #1a73e8;
            background: #e8f0fe;
        }
        .template-item i {
            margin-right: 4px;
        }
        .input-group {
            margin: 10px 0;
        }
        .input-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #5f6368;
            margin-bottom: 4px;
            display: block;
        }
        .input-field {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dadce0;
            border-radius: 14px;
            font-size: 0.85rem;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            background: #fff;
            color: #1e293b;
        }
        .input-field:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }
        textarea.input-field {
            resize: vertical;
            min-height: 80px;
        }
        .question-card {
            background: #fff;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #ecedef;
            transition: 0.2s;
            animation: fadeSlideUp 0.25s ease;
        }
        .question-card:hover {
            border-color: #dadce0;
        }
        .option-row {
            background: #f8f9fa;
            border-radius: 60px;
            padding: 10px 16px;
            margin: 8px 0;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
            position: relative;
            font-size: 0.9rem;
        }
        .option-row:hover {
            background: #f1f3f4;
            border-color: #dadce0;
        }
        .option-row .opt-letter {
            display: inline-flex;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #e8eaed;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7rem;
            color: #5f6368;
            flex-shrink: 0;
            transition: 0.3s;
        }
        .option-row.correct-feedback {
            background: #e6f4ea !important;
            border-color: #0f9d58 !important;
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(15, 157, 88, 0.25);
        }
        .option-row.correct-feedback .opt-letter {
            background: #0f9d58;
            color: #fff;
            transform: scale(1.08);
        }
        .option-row.correct-feedback::after {
            content: "✓";
            position: absolute;
            right: 14px;
            color: #0f9d58;
            font-weight: 700;
            font-size: 1rem;
        }
        .option-row.wrong-feedback {
            background: #fce8e6 !important;
            border-color: #d93025 !important;
            transform: scale(0.97);
            box-shadow: 0 4px 16px rgba(217, 48, 37, 0.2);
        }
        .option-row.wrong-feedback .opt-letter {
            background: #d93025;
            color: #fff;
            transform: scale(0.9);
        }
        .option-row.wrong-feedback::after {
            content: "✗";
            position: absolute;
            right: 14px;
            color: #d93025;
            font-weight: 700;
            font-size: 1rem;
        }
        .option-row.highlight-correct {
            background: #e6f4ea !important;
            border-color: #0f9d58 !important;
            box-shadow: 0 0 0 3px #0f9d58, 0 4px 16px rgba(15, 157, 88, 0.2);
            transform: scale(1.02);
        }
        .option-row.highlight-correct .opt-letter {
            background: #0f9d58;
            color: #fff;
            transform: scale(1.05);
        }
        .option-row.highlight-correct::after {
            content: "✓";
            position: absolute;
            right: 14px;
            color: #0f9d58;
            font-weight: 700;
            font-size: 1rem;
        }
        .option-row.disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        .option-row.disabled:not(.correct-feedback):not(.wrong-feedback):not(.highlight-correct) {
            opacity: 0.5;
        }
        .progress-bar {
            background: #ecedef;
            border-radius: 100px;
            height: 5px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            background: #1a73e8;
            width: 0%;
            height: 100%;
            transition: width 0.4s ease;
        }
        .booklet-wrap {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            padding: 8px 0;
            border-bottom: 1px solid #ecedef;
            margin-bottom: 12px;
            border-radius: 0 0 14px 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .booklet {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 3px 2px 6px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
            flex-wrap: nowrap;
        }
        .booklet::-webkit-scrollbar {
            height: 3px;
        }
        .booklet::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 4px;
        }
        .booklet-btn {
            min-width: 32px;
            height: 32px;
            border-radius: 32px;
            background: #f1f3f4;
            border: none;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.7rem;
            flex-shrink: 0;
            transition: 0.2s;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .booklet-btn:hover {
            background: #e8eaed;
            transform: scale(1.05);
        }
        .booklet-btn.answered {
            background: #1a73e8;
            color: #fff;
        }
        .booklet-btn.active-q {
            border: 2px solid #1a73e8;
            background: #e8f0fe;
            transform: scale(1.08);
        }
        .booklet-btn.answered.active-q {
            background: #1557b0;
            border-color: #0d47a1;
        }
        .booklet-btn.timeout {
            background: #d93025;
            color: #fff;
        }
        .timer-badge {
            background: #1e293b;
            color: #fff;
            padding: 4px 12px;
            border-radius: 40px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .timer-badge.warning {
            background: #d93025;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .timer-badge.total-timer {
            font-size: 0.95rem;
            padding: 6px 16px;
            background: #1e293b;
        }
        .timer-badge.total-timer.warning {
            background: #d93025;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.25s;
            z-index: 2000;
            padding: 16px;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-card {
            background: #fff;
            border-radius: 28px;
            max-width: 520px;
            width: 100%;
            padding: 24px 20px;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes popIn {
            from {
                transform: scale(0.95) translateY(10px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .recap-item {
            border-radius: 14px;
            padding: 10px 14px;
            margin: 8px 0;
            text-align: left;
            border-left: 4px solid #fef7e0;
            background: #fef7e0;
        }
        .recap-item.correct-recap {
            background: #e6f4ea;
            border-left-color: #0f9d58;
        }
        .recap-item.wrong-recap {
            background: #fce8e6;
            border-left-color: #d93025;
        }
        .recap-item.unanswered-recap {
            background: #f1f3f4;
            border-left-color: #9aa0a6;
        }
        .recap-item .q-text {
            font-weight: 500;
            font-size: 0.85rem;
        }
        .recap-item .q-detail {
            font-size: 0.75rem;
            color: #5f6368;
            margin-top: 3px;
        }
        .recap-item .q-detail strong {
            color: #1e293b;
        }
        .copy-link-btn {
            background: #e8eaed;
            border-radius: 60px;
            padding: 6px 16px;
            font-size: 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: 0.2s;
            border: none;
            font-family: 'Inter', sans-serif;
        }
        .copy-link-btn:hover {
            background: #dadce0;
        }
        .quiz-name-input {
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-bottom: 2px solid #dadce0;
            padding: 4px 0;
            width: 100%;
            outline: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
        }
        .quiz-name-input:focus {
            border-color: #1a73e8;
        }
        .logo-preview {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ecedef;
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 10px;
            margin: 12px 0;
        }
        .stat-card {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 12px 10px;
            text-align: center;
            border: 1px solid #ecedef;
        }
        .stat-card .stat-number {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a73e8;
        }
        .stat-card .stat-label {
            font-size: 0.6rem;
            color: #5f6368;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top:
