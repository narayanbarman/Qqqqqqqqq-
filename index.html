        // ================================================================
        // QUIZ EVENTS
        // ================================================================
        function attachQuizEvents(data, t) {
            const questions = data.questions;
            const bookletDiv = document.getElementById("quizBookNav");
            const slidesContainer = document.getElementById("quizSlides");
            let answersLocal = playerAnswers.length === questions.length ? playerAnswers : new Array(questions.length)
                .fill(null);
            playerAnswers = answersLocal;
            let currentIdx = 0;
            let slides = [];

            bookletDiv.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                let btn = document.createElement("button");
                btn.innerText = i + 1;
                btn.className = "booklet-btn";
                if (answersLocal[i] !== null) btn.classList.add("answered");
                btn.addEventListener("click", () => showSlide(i));
                bookletDiv.appendChild(btn);
            }

            slidesContainer.innerHTML = '';
            questions.forEach((q, idx) => {
                let slide = document.createElement("div");
                slide.className = "question-card";
                slide.style.backgroundColor = t.cardBg;
                slide.style.display = idx === 0 ? "block" : "none";
                slide.style.borderColor = t.border;

                let answered = answersLocal[idx] !== null;

                slide.innerHTML = `
                        <h4 style="color:${t.text};margin-bottom:6px;font-size:0.95rem;">${idx+1}. ${q.text}</h4>
                        ${q.image ? `<img src="${q.image}" style="max-width:100%;max-height:120px;border-radius:14px;margin:6px 0;object-fit:contain;">` : ''}
                        <div class="options-area"></div>
                    `;

                let optsDiv = slide.querySelector(".options-area");
                const letters = ['A', 'B', 'C', 'D'];
                q.options.forEach((opt, oi) => {
                    let optDiv = document.createElement("div");
                    optDiv.className = "option-row";
                    optDiv.style.backgroundColor = t.optionBg;
                    optDiv.style.borderColor = t.border;
                    optDiv.innerHTML =
                        `<span class="opt-letter">${letters[oi] || oi+1}</span><span>${opt}</span>`;

                    if (answered) {
                        optDiv.classList.add("disabled");
                        if (opt === answersLocal[idx]) {
                            if (opt === q.correct) optDiv.classList.add("correct-feedback");
                            else optDiv.classList.add("wrong-feedback");
                        }
                        if (opt === q.correct && opt !== answersLocal[idx]) {
                            optDiv.classList.add("highlight-correct");
                        }
                    } else {
                        optDiv.addEventListener("click", function(e) {
                            if (!isQuizActive) return;
                            if (answersLocal[idx] !== null) return;

                            answersLocal[idx] = opt;
                            playerAnswers = answersLocal;

                            const allOpts = this.closest('.options-area').querySelectorAll('.option-row');
                            // Disable all options
                            allOpts.forEach(o => o.classList.add('disabled'));

                            // Determine if correct
                            if (opt === q.correct) {
                                this.classList.add('correct-feedback');
                            } else {
                                // Wrong: add red to this
                                this.classList.add('wrong-feedback');
                                // Immediately highlight correct answer with green
                                allOpts.forEach(o => {
                                    // Compare text content without the letter prefix
                                    const text = o.innerText.trim();
                                    if (text === q.correct) {
                                        o.classList.add('highlight-correct');
                                    }
                                });
                            }

                            updateBookletState(idx, true);
                            updateProgress();

                            setTimeout(() => {
                                if (idx < questions.length - 1) showSlide(idx + 1);
                            }, 900);
                        });
                    }
                    optsDiv.appendChild(optDiv);
                });
                slidesContainer.appendChild(slide);
                slides.push(slide);
            });

            function showSlide(index) {
                slides.forEach((s, i) => s.style.display = i === index ? "block" : "none");
                currentIdx = index;
                document.getElementById("quizCounter").innerText = `${index+1} / ${questions.length}`;
                let btns = bookletDiv.querySelectorAll(".booklet-btn");
                btns.forEach((b, i) => {
                    b.classList.toggle("active-q", i === index);
                    if (answersLocal[i] !== null) b.classList.add("answered");
                    else b.classList.remove("answered");
                });
                let target = btns[index];
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                updateProgress();
            }

            function updateBookletState(idx, answered) {
                let btns = bookletDiv.querySelectorAll(".booklet-btn");
                if (answered) btns[idx].classList.add("answered");
                else btns[idx].classList.remove("answered");
            }

            function updateProgress() {
                let answeredCount = answersLocal.filter(a => a !== null).length;
                let percent = (answeredCount / questions.length) * 100;
                const fill = document.getElementById("quizProgressFill");
                if (fill) fill.style.width = percent + "%";
                let btns = bookletDiv.querySelectorAll(".booklet-btn");
                btns.forEach((b, i) => {
                    if (answersLocal[i] !== null) b.classList.add("answered");
                    else b.classList.remove("answered");
                });
                if (answeredCount === questions.length && isQuizActive) {
                    setTimeout(() => {
                        if (isQuizActive) {
                            isQuizActive = false;
                            if (timerInterval) { clearInterval(timerInterval);
                                timerInterval = null; }
                            submitQuiz(data, answersLocal);
                        }
                    }, 600);
                }
            }

            document.getElementById("quizPrevBtn").onclick = () => { if (currentIdx > 0) showSlide(currentIdx - 1); };
            document.getElementById("quizNextBtn").onclick = () => {
                if (currentIdx < questions.length - 1) showSlide(currentIdx + 1);
                else {
                    if (isQuizActive) {
                        isQuizActive = false;
                        if (timerInterval) { clearInterval(timerInterval);
                            timerInterval = null; }
                        submitQuiz(data, answersLocal);
                    }
                }
            };

            showSlide(0);
            updateProgress();
        }

        // ================================================================
        // MOCK EVENTS (changeable radios)
        // ================================================================
        function attachMockEvents(data, t) {
            const questions = data.questions;
            const bookletDiv = document.getElementById("mockBookNav");
            const questionsDiv = document.getElementById("mockQuestionsList");

            let answersLocal = (playerAnswers && playerAnswers.length === questions.length) ? [...playerAnswers] :
            new Array(questions.length).fill(null);
            playerAnswers = answersLocal;

            bookletDiv.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                let btn = document.createElement("button");
                btn.innerText = i + 1;
                btn.className = "booklet-btn";
                if (answersLocal[i] !== null) btn.classList.add("answered");
                btn.addEventListener("click", () => {
                    let el = document.getElementById(`mock_q_${i}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
                bookletDiv.appendChild(btn);
            }

            questionsDiv.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            questions.forEach((q, idx) => {
                let qCard = document.createElement("div");
                qCard.className = "question-card";
                qCard.id = `mock_q_${idx}`;
                qCard.style.backgroundColor = t.cardBg;
                qCard.style.borderColor = t.border;

                const answered = answersLocal[idx] !== null;
                const answerText = answersLocal[idx] || '';

                qCard.innerHTML = `
                        <h4 style="color:${t.text};font-size:0.9rem;margin-bottom:4px;">${idx+1}. ${q.text}</h4>
                        ${q.image ? `<img src="${q.image}" style="max-width:100%;max-height:100px;border-radius:10px;margin:4px 0;object-fit:contain;">` : ''}
                        <div class="mock-options-wrap" style="margin-top:6px;"></div>
                    `;

                let optsWrap = qCard.querySelector(".mock-options-wrap");
                q.options.forEach((opt, oi) => {
                    let label = document.createElement("label");
                    label.className = "mock-option";
                    const isChecked = answered && opt === answerText;
                    label.innerHTML = `
                            <input type="radio" name="mock_q_${idx}" value="${opt}" ${isChecked ? 'checked' : ''}>
                            <span class="opt-label">${letters[oi] || oi+1}. ${opt}</span>
                        `;

                    // Always allow change
                    const radio = label.querySelector('input');
                    radio.addEventListener("change", function(e) {
                        if (!isQuizActive) {
                            // Revert if quiz not active
                            if (answersLocal[idx] !== null) {
                                const currentAnswer = answersLocal[idx];
                                optsWrap.querySelectorAll('input[type="radio"]').forEach(inp => {
                                    inp.checked = inp.value === currentAnswer;
                                });
                            }
                            return;
                        }

                        const selectedValue = e.target.value;
                        answersLocal[idx] = selectedValue;
                        playerAnswers = [...answersLocal];

                        optsWrap.querySelectorAll('.mock-option').forEach(el => {
                            el.classList.remove('selected');
                        });
                        label.classList.add('selected');

                        let btns = bookletDiv.querySelectorAll(".booklet-btn");
                        btns[idx].classList.add("answered");
                        updateMockProgress();

                        if (answersLocal.filter(a => a !== null).length === questions.length) {
                            setTimeout(() => {
                                if (isQuizActive) {
                                    isQuizActive = false;
                                    if (timerInterval) { clearInterval(timerInterval);
                                        timerInterval = null; }
                                    submitQuiz(data, answersLocal);
                                }
                            }, 600);
                        }
                    });

                    optsWrap.appendChild(label);

                    if (isChecked) {
                        label.classList.add('selected');
                    }
                });
                questionsDiv.appendChild(qCard);
            });

            function updateMockProgress() {
                let answered = answersLocal.filter(a => a !== null).length;
                let pct = Math.round((answered / questions.length) * 100);
                const countEl = document.getElementById("mockAnsweredCount");
                const pctEl = document.getElementById("mockProgressText");
                const fillEl = document.getElementById("mockProgressFill");
                if (countEl) countEl.innerText = `${answered} / ${questions.length} answered`;
                if (pctEl) pctEl.innerText = `${pct}%`;
                if (fillEl) fillEl.style.width = pct + "%";
                let btns = bookletDiv.querySelectorAll(".booklet-btn");
                btns.forEach((b, i) => {
                    if (answersLocal[i] !== null) b.classList.add("answered");
                    else b.classList.remove("answered");
                });
            }

            const submitBtn = document.getElementById("submitMockBtn");
            if (submitBtn) {
                const newBtn = submitBtn.cloneNode(true);
                submitBtn.parentNode.replaceChild(newBtn, submitBtn);
                newBtn.addEventListener('click', function() {
                    if (isQuizActive) {
                        const unanswered = playerAnswers.filter(a => a === null).length;
                        if (unanswered > 0 && !confirm(`You have ${unanswered} unanswered. Submit anyway?`))
                            return;
                        isQuizActive = false;
                        if (timerInterval) { clearInterval(timerInterval);
                            timerInterval = null; }
                        submitQuiz(data, playerAnswers);
                    }
                });
            }

            updateMockProgress();
            setTimeout(() => {
                let idx = answersLocal.findIndex(a => a === null);
                if (idx !== -1) {
                    let el = document.getElementById(`mock_q_${idx}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 300);
        }

        // ================================================================
        // TIMER
        // ================================================================
        function startTotalTimer(data) {
            if (timerInterval) clearInterval(timerInterval);
            const total = data.timerSeconds * data.questions.length;
            timeRemaining = total;

            timerInterval = setInterval(() => {
                timeRemaining--;
                const timerEl = document.getElementById("quizTotalTimer") || document.getElementById(
                "mockTotalTimer");
                if (timerEl) {
                    timerEl.innerHTML = `⏱️ ${formatTime(timeRemaining)}`;
                    if (timeRemaining <= 10) timerEl.classList.add("warning");
                }
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    if (isQuizActive) {
                        isQuizActive = false;
                        showTimeOverModal(data);
                    }
                }
            }, 1000);
        }

        function showTimeOverModal(data) {
            const answers = playerAnswers || new Array(data.questions.length).fill(null);
            const modal = document.createElement("div");
            modal.className = "modal-overlay active time-over-modal";
            modal.innerHTML = `
                    <div class="modal-card">
                        <div class="big-icon"><i class="fas fa-hourglass-end" style="font-size:3.5rem;color:#d93025;margin-bottom:8px;display:block;"></i></div>
                        <h2 style="color:#d93025;font-size:1.3rem;">⏰ Time's Over!</h2>
                        <p style="color:#5f6368;margin:6px 0 12px;font-size:0.9rem;">You ran out of time. Let's see your results.</p>
                        <div style="background:#f8f9fa;border-radius:14px;padding:10px;margin-bottom:12px;">
                            <div style="display:flex;justify-content:space-between;font-size:0.85rem;">
                                <span>Answered:</span>
                                <strong>${answers.filter(a=>a!==null).length} / ${data.questions.length}</strong>
                            </div>
                            <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-top:3px;">
                                <span>Unanswered:</span>
                                <strong style="color:#d93025;">${answers.filter(a=>a===null).length}</strong>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-lg btn-block" id="showResultsFromTimeBtn" style="justify-content:center;">
                            <i class="fas fa-chart-bar"></i> Show Results
                        </button>
                    </div>
                `;
            document.body.appendChild(modal);
            document.getElementById("showResultsFromTimeBtn").onclick = () => {
                modal.remove();
                submitQuiz(data, answers);
            };
            modal.addEventListener("click", (e) => { if (e.target === modal) modal.remove(); });
        }

        // ================================================================
        // SUBMIT QUIZ
        // ================================================================
        function submitQuiz(data, answers) {
            const questions = data.questions;
            const results = questions.map((q, i) => ({
                question: q.text,
                userAnswer: answers[i] || null,
                correctAnswer: q.correct,
                isCorrect: answers[i] === q.correct,
                image: q.image,
                isUnanswered: answers[i] === null
            }));
            const correctCount = results.filter(r => r.isCorrect).length;
            const unansweredCount = results.filter(r => r.isUnanswered).length;

            quizResults = {
                score: correctCount,
                total: questions.length,
                unanswered: unansweredCount,
                results: results,
                mode: data.mode
            };

            if (currentShortId) {
                addQuizPlay(currentShortId, {
                    score: correctCount,
                    total: questions.length,
                    results: results,
                    mode: data.mode,
                    name: "Player"
                });
            }

            showScoreModal(quizResults);
        }

        // ================================================================
        // SCORE MODAL
        // ================================================================
        function showScoreModal(results) {
            const { score, total, unanswered, results: items } = results;
            const percent = Math.round((score / total) * 100);

            let modal = document.createElement("div");
            modal.className = "modal-overlay active";
            modal.innerHTML = `
                    <div class="modal-card">
                        <h2 style="color:#1a73e8;margin-bottom:3px;font-size:1.3rem;"><i class="fas fa-chart-simple"></i> Your Results</h2>
                        <div style="position:relative;width:120px;margin:10px auto;">
                            <canvas id="scoreCanvas" width="140" height="140"></canvas>
                            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.6rem;font-weight:700;color:#1e293b;">
                                ${percent}<span style="font-size:0.7rem;">%</span>
                            </div>
                        </div>
                        <p style="font-size:1rem;font-weight:600;">${score} / ${total} correct</p>
                        ${unanswered > 0 ? `<p style="font-size:0.8rem;color:#d93025;">⚠️ ${unanswered} question(s) unanswered</p>` : ''}
                        <p style="font-size:0.8rem;color:#5f6368;margin-bottom:12px;">
                            ${percent >= 80 ? '🌟 Excellent!' : percent >= 60 ? '👏 Good job!' : '📚 Keep practicing!'}
                        </p>
                        <div class="flex-between" style="gap:6px;">
                            <button id="recapBtn" class="btn btn-outline btn-sm"><i class="fas fa-list-ul"></i> Recap</button>
                            <button id="closeScoreBtn" class="btn btn-primary btn-sm"><i class="fas fa-check"></i> Done</button>
                        </div>
                    </div>
                `;
            document.body.appendChild(modal);

            let ctx = document.getElementById("scoreCanvas").getContext("2d");
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Correct', 'Wrong', 'Unanswered'],
                    datasets: [{ data: [score, total - score - unanswered, unanswered], backgroundColor: [
                            '#0f9d58', '#d93025', '#9aa0a6'
                        ], borderWidth: 0, cutout: '68%' }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });

            document.getElementById("recapBtn").onclick = () => showFullRecap(items);
            document.getElementById("closeScoreBtn").onclick = () => {
                modal.remove();
                isQuizActive = false;
                quizResults = null;
                playerAnswers = [];
                if (currentShortId) {
                    const data = getQuizData(currentShortId);
                    if (data) renderAssessmentFromData(data);
                }
            };
            modal.addEventListener("click", (e) => { if (e.target === modal) modal.remove(); });
        }

        function showFullRecap(results) {
            let modal = document.createElement("div");
            modal.className = "modal-overlay active";
            let html =
                `<div class="modal-card" style="max-width:600px;max-height:75vh;overflow:auto;text-align:left;padding:20px 16px;">
                        <h3 style="text-align:center;margin-bottom:10px;font-size:1.1rem;"><i class="fas fa-receipt"></i> Detailed Recap</h3>`;
            results.forEach((r, i) => {
                let cls = r.isCorrect ? "correct-recap" : r.isUnanswered ? "unanswered-recap" : "wrong-recap";
                let icon = r.isCorrect ? "✅" : r.isUnanswered ? "⏳" : "❌";
                let label = r.isUnanswered ? "Not answered" : r.userAnswer || "—";
                html += `
                        <div class="recap-item ${cls}">
                            <div class="q-text">${icon} ${i+1}. ${r.question}</div>
                            <div class="q-detail">Your answer: <strong>${label}</strong> &nbsp;|&nbsp; Correct: <strong>${r.correctAnswer}</strong></div>
                            ${r.image ? `<div class="q-detail"><img src="${r.image}" style="max-width:70px;border-radius:6px;margin-top:3px;"></div>` : ''}
                        </div>`;
            });
            html +=
                `<button id="closeRecapFinal" class="btn btn-primary btn-block mt-3" style="justify-content:center;">Close</button></div>`;
            modal.innerHTML = html;
            document.body.appendChild(modal);
            document.getElementById("closeRecapFinal").onclick = () => modal.remove();
            modal.addEventListener("click", (e) => { if (e.target === modal) modal.remove(); });
        }

        // ================================================================
        // HELPERS
        // ================================================================
        function formatTime(sec) {
            if (sec < 0) sec = 0;
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        // ================================================================
        // RESOLVE SHARED QUIZ
        // ================================================================
        function resolveSharedQuiz() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("q");
            if (id) {
                const data = getQuizData(id);
                if (data && data.questions && data.questions.length) {
                    currentShortId = id;
                    currentQuizData = data;
                    selectedTemplate = data.template || "default";
                    applyTemplate(selectedTemplate);

                    document.getElementById("stepUpload").style.display = "none";
                    document.getElementById("stepType").style.display = "none";
                    document.getElementById("createdArea").style.display = "block";

                    document.querySelectorAll("#tabBar .tab-btn").forEach(b => {
                        if (b.dataset.tab === "play") {
                            b.classList.add("active");
                            b.style.display = "flex";
                        } else {
                            b.style.display = "none";
                        }
                    });
                    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
                    document.getElementById("panelPlay").classList.add("active");

                    const url = `${window.location.origin}${window.location.pathname}?q=${id}`;
                    document.getElementById("shareLinkInput").value = url;

                    isQuizStarted = false;
                    isQuizActive = false;
                    quizResults = null;
                    playerAnswers = [];
                    if (timerInterval) { clearInterval(timerInterval);
                        timerInterval = null; }

                    renderAssessmentFromData(data);
                    currentView = 'play';
                    currentViewData = { id };
                    saveState();
                    return true;
                } else {
                    showToast("Quiz not found");
                }
            }
            return false;
        }

        // ================================================================
        // TAB HANDLING
        // ================================================================
        document.querySelectorAll("#tabBar .tab-btn").forEach(btn => {
            btn.addEventListener("click", function() {
                const tab = this.dataset.tab;
                if (tab === "create") {
                    navigateTo('create');
                    return;
                }
                document.querySelectorAll("#tabBar .tab-btn").forEach(b => b.classList.remove("active"));
                this.classList.add("active");
                document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
                const panel = document.getElementById("panel" + tab.charAt(0).toUpperCase() + tab.slice(1));
                if (panel) panel.classList.add("active");

                if (tab === "dashboard") {
                    navigateTo('dashboard');
                } else if (tab === "play") {
                    if (currentShortId) {
                        const data = getQuizData(currentShortId);
                        if (data) {
                            if (quizResults) {
                                isQuizActive = false;
                                quizResults = null;
                                playerAnswers = [];
                                if (timerInterval) { clearInterval(timerInterval);
                                    timerInterval = null; }
                                isQuizStarted = false;
                            }
                            renderAssessmentFromData(data);
                        }
                    }
                    currentView = 'play';
                    saveState();
                } else if (tab === "share") {
                    const url = `${window.location.origin}${window.location.pathname}?q=${currentShortId}`;
                    document.getElementById("shareLinkInput").value = url;
                    currentView = 'share';
                    saveState();
                }
            });
        });

        // ================================================================
        // CREATE FLOW EVENTS
        // ================================================================

        document.getElementById("chooseFileBtn").onclick = () => document.getElementById("fileInput").click();
        document.getElementById("fileInput").onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                if (file.name.endsWith('.xlsx')) {
                    const data = new Uint8Array(ev.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    const csv = rows.map(r => r.join(',')).join('\n');
                    document.getElementById("bulkTextArea").value = csv;
                    processBulk();
                } else {
                    document.getElementById("bulkTextArea").value = ev.target.result;
                    processBulk();
                }
            };
            if (file.name.endsWith('.xlsx')) reader.readAsArrayBuffer(file);
            else reader.readAsText(file);
        };

        document.getElementById("bulkTextArea").addEventListener("input", processBulk);

        document.getElementById("logoUpload").onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    quizLogo = ev.target.result;
                    document.getElementById("logoPreview").innerHTML =
                        `<img src="${quizLogo}" class="logo-preview">`;
                    saveState();
                };
                reader.readAsDataURL(file);
            }
        };

        document.querySelectorAll(".template-item").forEach(el => {
            el.addEventListener("click", () => {
                document.querySelectorAll(".template-item").forEach(t => t.classList.remove("active"));
                el.classList.add("active");
                selectedTemplate = el.dataset.template;
                applyTemplate(selectedTemplate);
                saveState();
            });
        });

        document.getElementById("chooseQuizBtn").onclick = () => {
            currentMode = "quiz";
            document.getElementById("chooseQuizBtn").className = "btn btn-primary";
            document.getElementById("chooseMockBtn").className = "btn btn-outline";
            saveState();
        };
        document.getElementById("chooseMockBtn").onclick = () => {
            currentMode = "mock";
            document.getElementById("chooseMockBtn").className = "btn btn-primary";
            document.getElementById("chooseQuizBtn").className = "btn btn-outline";
            saveState();
        };

        document.getElementById("enableTimerCheck").onchange = function() {
            timerEnabled = this.checked;
            document.getElementById("timerSeconds").disabled = !this.checked;
            saveState();
        };

        document.getElementById("timerSeconds").onchange = function() {
            timerSeconds = parseInt(this.value) || 10;
            saveState();
        };

        document.getElementById("nextToTypeBtn").onclick = () => {
            if (questionsBank.length === 0) return showToast("Please add some questions first");
            quizTitle = document.getElementById("quizNameInput").value || "My Quiz";
            document.getElementById("stepUpload").style.display = "none";
            document.getElementById("stepType").style.display = "block";
            applyTemplate(selectedTemplate);
            saveState();
        };

        document.getElementById("backFromTypeBtn").onclick = () => {
            document.getElementById("stepType").style.display = "none";
            document.getElementById("stepUpload").style.display = "block";
            saveState();
        };

        document.getElementById("cancelCreateBtn").onclick = () => {
            navigateTo('dashboard');
        };

        // ================================================================
        // FINAL CREATE
        // ================================================================
        document.getElementById("finalCreateBtn").onclick = () => {
            if (questionsBank.length === 0) return showToast("Please load questions first");

            const id = generateId();
            const data = {
                title: quizTitle,
                questions: JSON.parse(JSON.stringify(questionsBank)),
                mode: currentMode,
                template: selectedTemplate,
                logo: quizLogo,
                timerEnabled: document.getElementById("enableTimerCheck").checked,
                timerSeconds: parseInt(document.getElementById("timerSeconds").value) || 10,
                createdAt: Date.now()
            };

            saveQuizData(id, data);
            currentShortId = id;
            currentQuizData = data;
            isQuizStarted = false;
            isQuizActive = false;
            quizResults = null;
            playerAnswers = [];
            if (timerInterval) { clearInterval(timerInterval);
                timerInterval = null; }

            const url = `${window.location.origin}${window.location.pathname}?q=${id}`;

            document.getElementById("createdArea").style.display = "block";
            document.getElementById("stepUpload").style.display = "none";
            document.getElementById("stepType").style.display = "none";

            document.querySelectorAll("#tabBar .tab-btn").forEach(b => {
                b.style.display = "flex";
                b.classList.remove("active");
            });
            document.querySelector("#tabBar .tab-btn[data-tab='play']")?.classList.add("active");
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
            document.getElementById("panelPlay").classList.add("active");

            document.getElementById("shareLinkInput").value = url;

            document.getElementById("copyLinkBtn").onclick = () => {
                navigator.clipboard.writeText(url).then(() => showToast("Link copied!")).catch(() => {
                    const inp = document.getElementById("shareLinkInput");
                    inp.select();
                    document.execCommand("copy");
                    showToast("Link copied!");
                });
            };

            document.getElementById("shareWhatsApp").onclick = () => {
                window.open(`https://wa.me/?text=Take my quiz! ${encodeURIComponent(url)}`, '_blank');
            };
            document.getElementById("shareTwitter").onclick = () => {
                window.open(`https://twitter.com/intent/tweet?text=Take my quiz!&url=${encodeURIComponent(url)}`,
                    '_blank');
            };
            document.getElementById("shareEmail").onclick = () => {
                window.location.href = `mailto:?subject=Quiz Invitation&body=Take my quiz: ${url}`;
            };

            renderAssessmentFromData(data);
            showToast("✅ Quiz created! Share the link with students.");
            currentView = 'play';
            currentViewData = { id };
            saveState();
        };

        // ================================================================
        // INIT
        // ================================================================
        window.onload = function() {
            document.querySelector(".template-item[data-template='default']")?.classList.add("active");
            applyTemplate("default");

            const hasShared = resolveSharedQuiz();
            if (!hasShared) {
                const restored = restoreState();
                if (restored && currentView === 'play' && currentShortId) {
                    const data = getQuizData(currentShortId);
                    if (data) {
                        currentQuizData = data;
                        selectedTemplate = data.template || "default";
                        applyTemplate(selectedTemplate);
                        document.getElementById("createdArea").style.display = "block";
                        document.querySelectorAll("#tabBar .tab-btn").forEach(b => {
                            b.style.display = "flex";
                            b.classList.remove("active");
                        });
                        document.querySelector("#tabBar .tab-btn[data-tab='play']")?.classList.add("active");
                        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
                        document.getElementById("panelPlay").classList.add("active");
                        renderAssessmentFromData(data);
                        return;
                    }
                }
                if (restored && currentView === 'create') {
                    showCreateView();
                    return;
                }
                if (restored && currentView === 'share' && currentShortId) {
                    showShareView();
                    return;
                }
                if (restored && currentView === 'dashboard') {
                    showDashboardView();
                    return;
                }
                // Default: show create page
                showCreateView();
            }

            processBulk();
        };

        window.addEventListener('beforeunload', function() {
            saveState();
        });

        window.navigateTo = navigateTo;
        window.showCreateView = showCreateView;
        window.showDashboardView = showDashboardView;
    </script>
</body>
</html>
